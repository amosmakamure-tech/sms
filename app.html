<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>School Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js">
    </script>
    <style>
        :root {
            --primary: #1a237e;
            --primary-light: #3949ab;
            --secondary: #0d47a1;
            --accent: #ffd600;
            --success: #2e7d32;
            --danger: #c62828;
            --warning: #f57f17;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #212121;
            --text-light: #757575;
            --border: #e0e0e0;
            --sidebar-width: 260px;
            --radius: 12px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            overscroll-behavior: none;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 4px;
        }

        #loginScreen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #1565c0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 16px;
        }
        .login-box {
            background: #fff;
            border-radius: 24px;
            padding: 40px 32px;
            width: 420px;
            max-width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            text-align: center;
        }
        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e8eaf6;
            border: 3px solid var(--primary);
        }
        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .login-logo span {
            font-size: 32px;
        }
        .login-box h2 {
            color: var(--primary);
            font-size: 22px;
            margin-bottom: 4px;
        }
        .login-box p.sub {
            color: var(--text-light);
            font-size: 13px;
            margin-bottom: 24px;
        }
        .login-box input,
        .login-box select {
            width: 100%;
            padding: 13px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 14px;
            transition: border-color 0.25s;
            outline: none;
            background: #fff;
        }
        .login-box input:focus,
        .login-box select:focus {
            border-color: var(--primary);
        }
        .password-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 14px;
        }
        .password-wrapper input {
            margin-bottom: 0;
            padding-right: 48px;
        }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            color: var(--text-light);
            touch-action: manipulation;
            line-height: 1;
        }
        .password-toggle:hover {
            color: var(--primary);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s;
        }
        .login-btn:hover {
            background: var(--primary-light);
        }
        .login-error {
            color: var(--danger);
            font-size: 13px;
            margin: -8px 0 10px;
            display: none;
        }

        #appLayout {
            display: flex;
            min-height: 100vh;
        }

        #sidebar {
            width: var(--sidebar-width);
            background: var(--primary);
            color: #fff;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }
        #sidebar.collapsed {
            transform: translateX(-100%);
        }
        .sidebar-header {
            padding: 18px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            background: #fff;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid var(--accent);
        }
        .sidebar-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sidebar-header-info {
            flex: 1;
            min-width: 0;
        }
        .school-name-sidebar {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-user {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 2px;
        }
        .sidebar-nav {
            flex: 1;
            padding: 8px 0 80px;
            overflow-y: auto;
        }
        .nav-section {
            padding: 10px 16px 4px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.5;
            font-weight: 600;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 16px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 14px;
            border-left: 3px solid transparent;
            touch-action: manipulation;
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .nav-item.active {
            background: rgba(255, 255, 255, 0.15);
            border-left-color: var(--accent);
        }
        .nav-item .icon {
            width: 22px;
            text-align: center;
            font-size: 17px;
            flex-shrink: 0;
        }

        #main {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: margin-left 0.3s;
        }
        #main.full {
            margin-left: 0;
        }

        #topbar {
            background: #fff;
            padding: 0 16px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 8px;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        #menuToggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--primary);
            padding: 4px 6px;
            touch-action: manipulation;
        }
        .page-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .topbar-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-light);
            position: relative;
            padding: 4px;
            touch-action: manipulation;
        }
        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: #fff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .user-avatar {
            width: 34px;
            height: 34px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
            touch-action: manipulation;
        }

        #content {
            padding: 16px;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px;
            margin-bottom: 18px;
            transition: box-shadow 0.2s;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 14px;
            border-left: 4px solid var(--primary);
        }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            background: #e8eaf6;
        }
        .stat-info h3 {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
        }
        .stat-info p {
            font-size: 12px;
            color: var(--text-light);
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-light);
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background: #388e3c;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #e53935;
        }
        .btn-warning {
            background: var(--warning);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: #fff;
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -4px;
            padding: 0 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 600px;
        }
        th {
            background: var(--primary);
            color: #fff;
            padding: 10px 12px;
            text-align: left;
            font-weight: 500;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        td {
            padding: 9px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:hover td {
            background: #f8f9ff;
        }
        .profile-thumb {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #e0e0e0;
            display: block;
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 14px;
            justify-content: center;
        }
        .pagination button {
            padding: 5px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s;
            touch-action: manipulation;
        }
        .pagination button:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .pagination button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .badge-status {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-success {
            background: #e8f5e9;
            color: var(--success);
        }
        .badge-danger {
            background: #ffebee;
            color: var(--danger);
        }
        .badge-warning {
            background: #fff8e1;
            color: var(--warning);
        }
        .badge-info {
            background: #e3f2fd;
            color: #1565c0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 500;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 9px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
            width: 100%;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }
        .form-group input[type="file"] {
            padding: 6px 0;
            border: none;
        }
        .form-group .toggle-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .form-group .toggle-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 400;
            font-size: 13px;
            cursor: pointer;
        }
        .form-group .toggle-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeIn 0.2s;
        }
        .modal {
            background: #fff;
            border-radius: 16px;
            width: 100%;
            max-width: 720px;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.25s;
        }
        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 5;
            border-radius: 16px 16px 0 0;
        }
        .modal-header h3 {
            font-size: 17px;
            font-weight: 600;
            color: var(--primary);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-light);
            padding: 0 4px;
            touch-action: manipulation;
        }
        .modal-body {
            padding: 20px;
        }
        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tabs {
            display: flex;
            gap: 2px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            flex-wrap: nowrap;
        }
        .tab {
            padding: 9px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-light);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            white-space: nowrap;
            transition: all 0.2s;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .chart-container {
            position: relative;
            height: 250px;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            align-items: flex-end;
        }
        .filter-bar input,
        .filter-bar select {
            padding: 8px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            background: #fff;
            min-width: 120px;
            flex: 1 1 auto;
        }
        .filter-bar input:focus,
        .filter-bar select:focus {
            border-color: var(--primary);
        }
        .filter-bar .btn {
            flex-shrink: 0;
        }

        .attendance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }
        .att-student-card {
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            transition: all 0.2s;
            background: #fff;
        }
        .att-student-card.present {
            border-color: var(--success);
            background: #f1f8f1;
        }
        .att-student-card.absent {
            border-color: var(--danger);
            background: #fff5f5;
        }
        .att-student-card.late {
            border-color: var(--warning);
            background: #fffbf0;
        }
        .att-student-card.sick {
            border-color: #7b1fa2;
            background: #f3e5f5;
        }
        .att-name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .att-buttons {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .att-btn {
            padding: 3px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            touch-action: manipulation;
        }
        .att-btn.p {
            background: var(--success);
            color: #fff;
        }
        .att-btn.a {
            background: var(--danger);
            color: #fff;
        }
        .att-btn.l {
            background: var(--warning);
            color: #fff;
        }
        .att-btn.s {
            background: #7b1fa2;
            color: #fff;
        }

        .mark-input {
            width: 60px;
            padding: 5px;
            border: 1.5px solid var(--border);
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
        }
        .mark-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .grade-A {
            color: var(--success);
            font-weight: 700;
        }
        .grade-B {
            color: #1565c0;
            font-weight: 700;
        }
        .grade-C {
            color: var(--warning);
            font-weight: 700;
        }
        .grade-D {
            color: #e65100;
            font-weight: 700;
        }
        .grade-E {
            color: #c62828;
            font-weight: 700;
        }
        .grade-U {
            color: #757575;
            font-weight: 700;
        }

        .fee-breakdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 10px;
        }
        .fee-component {
            background: #f8f9ff;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid var(--border);
        }
        .fee-component-name {
            font-size: 12px;
            color: var(--text-light);
        }
        .fee-component-amount {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .progress-bar {
            background: var(--border);
            border-radius: 10px;
            height: 7px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s;
        }

        .whatsapp-panel {
            background: #dcf8c6;
            border-radius: 10px;
            padding: 14px;
            margin-top: 12px;
        }
        .whatsapp-preview {
            background: #fff;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            white-space: pre-wrap;
            border-left: 4px solid #25d366;
            font-family: inherit;
        }

        .upload-zone {
            border: 2px dashed var(--primary-light);
            border-radius: var(--radius);
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafbff;
        }
        .upload-zone:hover {
            background: #f0f4ff;
            border-color: var(--primary);
        }
        .doc-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveStateToIndexedDB(data) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put({ id: 'main', data });
                await new Promise((resolve, reject) => {
                    tx.oncomplete = resolve;
                    tx.onerror = reject;
                });
                return true;
            } catch (e) {
                console.warn('IndexedDB save failed, using localStorage fallback', e);
                try { localStorage.setItem('SMS_state', JSON.stringify(data)); } catch (e2) {}
                return false;
            }
        }

        async function loadStateFromIndexedDB() {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const result = await new Promise((resolve, reject) => {
                    const req = store.get('main');
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
                if (result && result.data) return result.data;
            } catch (e) {
                console.warn('IndexedDB load failed, trying localStorage', e);
            }
            try {
                const raw = localStorage.getItem('SMS_state');
                if (raw) return JSON.parse(raw);
            } catch (e) {}
            return null;
        }

        async function loadState() {
            const data = await loadStateFromIndexedDB();
            if (data) {
                state = data;
                if (!state.assets) state.assets = [];
                if (!state.notices) state.notices = [];
                if (!state.staff) state.staff = [];
                if (!state.administration) state.administration = [];
                if (!state.learnerProfiles) state.learnerProfiles = [];
                if (!state.supervision) state.supervision = [];
                if (!state.lessonObservations) state.lessonObservations = [];
                if (!state.exerciseInspections) state.exerciseInspections = [];
                if (!state.attendanceRegisterInspections) state.attendanceRegisterInspections = [];
                if (!state.discipline) state.discipline = [];
                if (!state.bankDeposits) state.bankDeposits = [];
                if (!state.subjectConfigs) state.subjectConfigs = {};
                if (!state.overallRemarks) state.overallRemarks = {};
                if (state.settings && state.settings.nextTermFees === undefined) state.settings.nextTermFees = 850;
                if (state.settings && !state.settings.nextTerm) state.settings.nextTerm = 'Term 2';
                if (state.settings && !state.settings.nextTermOpens) state.settings.nextTermOpens = '';
                // Repair old bulk-billed records: billing must start at $0 paid (full amount as balance)
                // + snapshot billed structure on records created before it existed + recompute status
                if (state.fees) state.fees.forEach(f => {
                    if (f.method === 'Bulk Billing' && f.status === 'Unpaid' && f.payments) {
                        Object.keys(f.payments).forEach(k => { f.payments[k] = 0; });
                    }
                    if (!f.billed || !Object.keys(f.billed).length) {
                        f.billed = {};
                        state.feeComponents.forEach(fc => { f.billed[fc.id] = fc.amount; });
                    }
                    if (!f.payments) f.payments = {};
                    const _paid = Object.values(f.payments).reduce((s, v) => s + (Number(v) || 0), 0);
                    const _billed = Object.values(f.billed).reduce((s, v) => s + (Number(v) || 0), 0);
                    f.status = _paid >= _billed ? 'Paid' : _paid > 0 ? 'Partial' : 'Unpaid';
                });
                if (!state.timetableInput) state.timetableInput = [];
                if (!state.timetablePeriods) state.timetablePeriods = ['8:00-9:00', '9:00-10:00', '10:00-11:00', '11:00-12:00', '12:00-13:00', '13:00-14:00', '14:00-15:00'];
                state.committees.forEach(c => {
                    if (c.members && c.members.length > 0 && typeof c.members[0] === 'string') {
                        c.members = c.members.map(name => ({ name, position: 'Member', photo: null }));
                    }
                    if (!c.members) c.members = [];
                    c.members.forEach(m => { if (!m.position) m.position = 'Member'; });
                });
                await saveState();
                return;
            }
            state = getDefaultState();
            await saveState();
        }

        function hashPassword(pwd) {
            let hash = 0;
            for (let i = 0; i < pwd.length; i++) {
                const char = pwd.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return 'h_' + Math.abs(hash).toString(36) + '_' + pwd.length;
        }

        function verifyPassword(plain, hashed) {
            return hashPassword(plain) === hashed;
        }

        function downloadCSV(filename, headers, rows) {
            const csv = [headers.join(','), ...rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(','))]
                .join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename + '.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function downloadCSVRaw(filename, rows) {
            const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename + '.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function getPaginatedData(data, pageKey, pageSize = 10) {
            if (!paginationState[pageKey]) paginationState[pageKey] = { page: 1, total: data.length };
            const pg = paginationState[pageKey];
            pg.total = data.length;
            const start = (pg.page - 1) * pageSize;
            const end = Math.min(start + pageSize, data.length);
            return { items: data.slice(start, end), page: pg.page, totalPages: Math.ceil(data.length / pageSize) || 1 };
        }

        function renderPagination(pageKey, totalPages, containerId, onPage) {
            const wrap = $(containerId);
            if (!wrap) return;
            const pg = paginationState[pageKey] || { page: 1 };
            let html = `<div class="pagination">
                <button onclick="${onPage}(${pg.page-1})" ${pg.page<=1?'disabled':''}>◀</button>`;
            for (let i = 1; i <= totalPages; i++) {
                html +=
                    `<button class="${i===pg.page?'active':''}" onclick="${onPage}(${i})">${i}</button>`;
            }
            html +=
                `<button onclick="${onPage}(${pg.page+1})" ${pg.page>=totalPages?'disabled':''}>▶</button>
            </div>`;
            wrap.innerHTML = html;
        }

        async function doLogin() {
            const ident = val('loginUsername').trim();
            const password = val('loginPassword');
            const errEl = $('loginError');
            errEl.style.display = 'none';

            if (!ident || !password) {
                errEl.textContent = '❌ Please fill all fields.';
                errEl.style.display = 'block';
                return;
            }

            // ---------- CLOUD MODE (Supabase) ----------
            if (window.SMS_SUPABASE.configured) {
                if (!ident.includes('@')) {
                    errEl.textContent = '❌ Cloud login uses your email address.';
                    errEl.style.display = 'block';
                    return;
                }
                const res = await window.SMS_SUPABASE.signIn(ident, password);
                if (!res.ok) {
                    errEl.textContent = '❌ ' + res.error;
                    errEl.style.display = 'block';
                    return;
                }
                currentUser = res.profile;
                currentUser.password = null;
                const base = getDefaultState();
                if (currentUser.schoolId) {
                    const pull = await window.SMS_SUPABASE.pullState();
                    if (pull.ok && pull.state) {
                        Object.keys(pull.state).forEach(k => { if (pull.state[k] !== undefined) base[k] = pull.state[k]; });
                    }
                } else {
                    base.settings.schoolName = 'System Administrator';
                    base.settings.headName = currentUser.name;
                }
                base.users = [currentUser];
                state = base;
                await saveState();
                enterApp();
                return;
            }

            // ---------- LOCAL / OFFLINE MODE ----------
            if (!state) await loadState();

            const user = state.users.find(u =>
                (u.username === ident || u.email === ident) &&
                (u.role === 'admin' || u.role === 'head') &&
                verifyPassword(password, u.password)
            );
            if (!user) {
                errEl.textContent = '❌ Invalid credentials. Contact your administrator.';
                errEl.style.display = 'block';
                return;
            }

            currentUser = user;
            enterApp();
        }

        // ============================================================
        function noticeboardPage() {
            const isAdmin = ['admin', 'head'].includes(currentUser.role);
            const categories = ['General', 'Finance', 'Sports', 'Meetings', 'Rules'];

            let html = `
            <div class="card">
                <div class="card-header">
                    <span class="card-title">📢 Noticeboard</span>
                    ${isAdmin ? `<button class="btn btn-primary" onclick="openAddNotice()">➕ Add Notice</button>` : ''}
                </div>
                <div class="filter-bar">
                    <select id="noticeFilter" onchange="renderNotices()">
                        <option value="">All Categories</option>
                        ${categories.map(c => `<option value="${c}">${c}</option>`).join('')}
                    </select>
                    <input type="text" id="noticeSearch" placeholder="🔍 Search..." oninput="renderNotices()">
                </div>
                <div id="noticesContainer"></div>
            </div>`;
            $('pageContent').innerHTML = html;
            renderNotices();
        }

        function renderNotices() {
            const filter = document.getElementById('noticeFilter')?.value || '';
            const search = document.getElementById('noticeSearch')?.value?.toLowerCase() || '';
            let notices = [...state.notices];
            if (filter) notices = notices.filter(n => n.category === filter);
            if (search) notices = notices.filter(n => n.title.toLowerCase().includes(search) || n.content.toLowerCase()
                .includes(search));
            notices.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || new Date(b.date) - new Date(a.date));

            const container = document.getElementById('noticesContainer');
            if (!container) return;

            if (!notices.length) {
                container.innerHTML =
                    '<div class="empty-state"><div class="icon">📢</div><h3>No notices found</h3><p>Check back later for updates.</p></div>';
                return;
            }

            const isAdmin = ['admin', 'head'].includes(currentUser.role);
            container.innerHTML = notices.map(n => `
                <div class="notice-item ${n.pinned?'pinned':''}">
                    <div class="notice-title">${n.pinned?'📌 ':''}${n.title}</div>
                    <div class="notice-meta">
                        <span class="notice-category ${n.category.toLowerCase()}">${n.category}</span>
                        <span>📅 ${n.date}</span>
                        <span>✍️ ${n.author}</span>
                        ${n.pinned ? '<span>🔹 Pinned</span>' : ''}
                    </div>
                    <div class="notice-content">${n.content}</div>
                    ${isAdmin ? `
                        <div class="notice-actions">
                            <button class="btn btn-sm btn-primary" onclick="editNotice('${n.id}')">✏️ Edit</button>
                            <button class="btn btn-sm btn-warning" onclick="togglePinNotice('${n.id}')">${n.pinned?'📌 Unpin':'📌 Pin'}</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteNotice('${n.id}')">🗑️ Delete</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function openAddNotice() {
            openModal('Add New Notice', `
            <div class="form-grid">
                <div class="form-group" style="grid-column:1/-1;"><label>Title*</label><input id="noticeTitle" placeholder="Notice title"></div>
                <div class="form-group" style="grid-column:1/-1;"><label>Content*</label><textarea id="noticeContent" rows="5" placeholder="Write your notice here..."></textarea></div>
                <div class="form-group"><label>Category</label>
                    <select id="noticeCategory">
                        <option value="General">General</option>
                        <option value="Finance">Finance</option>
                        <option value="Sports">Sports</option>
                        <option value="Meetings">Meetings</option>
                        <option value="Rules">Rules</option>
                    </select>
                </div>
                <div class="form-group"><label>Date</label><input type="date" id="noticeDate" value="${new Date().toISOString().split('T')[0]}"></div>
                <div class="form-group"><label>Pin this notice</label>
                    <select id="noticePinned">
                        <option value="false">No</option>
                        <option value="true">Yes</option>
                    </select>
                </div>
            </div>`, [
                { label: 'Cancel', cls: 'btn-outline', action: 'closeModal()' },
                { label: 'Publish', cls: 'btn-primary', action: 'saveNotice()' }
            ]);
        }

        function saveNotice() {
            const title = val('noticeTitle');
            const content = val('noticeContent');
            if (!title || !content) { toast('Title and content are required', 'error'); return; }
            const notice = {
                id: 'n' + Date.now(),
                title,
                content,
                category: val('noticeCategory'),
                date: val('noticeDate') || new Date().toISOString().split('T')[0],
                author: currentUser.name,
                pinned: val('noticePinned') === 'true'
            };
            state.notices.push(notice);
            saveState();
            closeModal();
            noticeboardPage();
            toast('Notice published!', 'success');
        }

        function editNotice(id) {
            const n = state.notices.find(x => x.id === id);
            if (!n) return;
            openModal('Edit Notice', `
            <div class="form-grid">
                <div class="form-group" style="grid-column:1/-1;"><label>Title*</label><input id="noticeTitle" value="${n.title}"></div>
                <div class="form-group" style="grid-column:1/-1;"><label>Content*</label><textarea id="noticeContent" rows="5">${n.content}</textarea></div>
                <div class="form-group"><label>Category</label>
                    <select id="noticeCategory">
                        <option value="General" ${n.category==='General'?'selected':''}>General</option>
                        <option value="Finance" ${n.category==='Finance'?'selected':''}>Finance</option>
                        <option value="Sports" ${n.category==='Sports'?'selected':''}>Sports</option>
                        <option value="Meetings" ${n.category==='Meetings'?'selected':''}>Meetings</option>
                        <option value="Rules" ${n.category==='Rules'?'selected':''}>Rules</option>
                    </select>
                </div>
                <div class="form-group"><label>Date</label><input type="date" id="noticeDate" value="${n.date}"></div>
                <div class="form-group"><label>Pin this notice</label>
                    <select id="noticePinned">
                        <option value="false" ${!n.pinned?'selected':''}>No</option>
                        <option value="true" ${n.pinned?'selected':''}>Yes</option>
                    </select>
                </div>
            </div>`, [
                { label: 'Cancel', cls: 'btn-outline', action: 'closeModal()' },
                { label: 'Update', cls: 'btn-primary', action: `updateNotice('${id}')` }
            ]);
        }

        function updateNotice(id) {
            const idx = state.notices.findIndex(x => x.id === id);
            if (idx === -1) return;
            const title = val('noticeTitle');
            const content = val('noticeContent');
            if (!title || !content) { toast('Title and content are required', 'error'); return; }
            state.notices[idx] = {
                ...state.notices[idx],
                title,
                content,
                category: val('noticeCategory'),
                date: val('noticeDate'),
                pinned: val('noticePinned') === 'true'
            };
            saveState();
            closeModal();
            noticeboardPage();
            toast('Notice updated!', 'success');
        }

        function togglePinNotice(id) {
            const n = state.notices.find(x => x.id === id);
            if (!n) return;
            n.pinned = !n.pinned;
            saveState();
            noticeboardPage();
            toast(n.pinned ? 'Notice pinned' : 'Notice unpinned', 'info');
        }

        function deleteNotice(id) {
            if (!confirm('Delete this notice?')) return;
            state.notices = state.notices.filter(n => n.id !== id);
            saveState();
            noticeboardPage();
            toast('Notice deleted', 'warning');
        }

        function students() {

            </div>`;
            renderStudentTable();

        function getFilteredStudents() {
            let list = [...state.students];
            if (studentFilter.search) list = list.filter(s =>
                s.name.toLowerCase().includes(studentFilter.search.toLowerCase()) ||
                s.admNo.toLowerCase().includes(studentFilter.search.toLowerCase())
            );
            if (studentFilter.class) list = list.filter(s => s.class === studentFilter.class);
            if (studentFilter.status) list = list.filter(s => s.status === studentFilter.status);
            if (studentFilter.gender) list = list.filter(s => s.gender === studentFilter.gender);
            list.sort((a, b) => {
                let va = a[studentSort.col] || '',
                    vb = b[studentSort.col] || '';
                return studentSort.dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
            });
            return list;
        }

        function renderStudentTable() {
            const list = getFilteredStudents();
            const { items, page, totalPages } = getPaginatedData(list, STUDENT_PAGE_KEY, 10);
            const wrap = $('studentTableWrap');
            if (!wrap) return;

            wrap.innerHTML = `<table>
                <thead><tr>
                    <th>Photo</th>
                    <th class="sortable ${studentSort.col==='admNo'?studentSort.dir:''}" onclick="sortStudents('admNo')">Adm No</th>

        function sendWhatsAppToParent(studentId) {
            const s = state.students.find(x => x.id === studentId);
            if (!s) return;
            if (!s.parentWhatsapp) {
                toast('No WhatsApp number for this parent', 'error');
                return;
            }
            const msg = encodeURIComponent(`Dear Parent/Guardian of ${s.name},\n\nThis is a message from ${state.settings.schoolName}.\n\nFor inquiries, please contact us on ${state.settings.phone}.\n\nRegards,\n${state.settings.headName}`);
            window.open(`https://wa.me/${s.parentWhatsapp.replace(/[^0-9]/g, '')}?text=${msg}`, '_blank');
        }

        function sendWhatsAppToParents() {
            const cls = val('sFiltClass');
            let students = state.students.filter(s => s.status === 'Active');
            if (cls) students = students.filter(s => s.class === cls);
            const hasWhatsapp = students.filter(s => s.parentWhatsapp);
            if (!hasWhatsapp.length) {
                toast('No active students with WhatsApp numbers', 'error');
                return;
            }
            const msg = encodeURIComponent(`Dear Parent/Guardian,\n\nThis is a message from ${state.settings.schoolName}.\n\nFor inquiries, please contact us on ${state.settings.phone}.\n\nRegards,\n${state.settings.headName}`);
            // Open first parent's WhatsApp as demo
            window.open(`https://wa.me/${hasWhatsapp[0].parentWhatsapp.replace(/[^0-9]/g, '')}?text=${msg}`, '_blank');
            toast(`Opening WhatsApp for first parent of ${hasWhatsapp.length} parents`, 'success');
        }

        function goToStudentPage(p) {
            if (p < 1) return;
            const list = getFilteredStudents();
            const totalPages = Math.ceil(list.length / 10) || 1;
            if (p > totalPages) return;
            paginationState[STUDENT_PAGE_KEY].page = p;
            renderStudentTable();

        function saveStudent() {
            const admNo = val('fAdmNo'),
                name = val('fName');
            if (!admNo || !name) { toast('Please fill required fields', 'error'); return; }
            const photoInput = document.getElementById('fPhoto');
            let photo = null;
            if (photoInput && photoInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const newS = buildStudentObject(e.target.result);
                    state.students.push(newS);
                    saveState();
                    closeModal();
                    students();
                    toast('Student added successfully!', 'success');
                };
                reader.readAsDataURL(photoInput.files[0]);
                return;
            }
            const newS = buildStudentObject(null);
            state.students.push(newS);
            saveState();
            closeModal();
            students();
            toast('Student added successfully!', 'success');
        }

        function updateStudent(id) {
            const idx = state.students.findIndex(x => x.id === id);
            const photoInput = document.getElementById('fPhoto');
            const updateFn = (photo) => {
                state.students[idx] = { ...state.students[idx],
                    admNo: val('fAdmNo'),
                    name: val('fName'),
                    class: val('fClass'),
                    gender: val('fGender'),
                    dob: val('fDob'),
                    nationalId: val('fNationalId'),
                    parent: val('fParent'),
                    phone: val('fPhone'),
                    parentWhatsapp: val('fWhatsapp'),
                    email: val('fEmail'),
                    address: val('fAddress'),
                    enrolled: val('fEnrolled'),
                    status: val('fStatus'),
                    chronicIllnesses: val('fChronic') || 'None',
                    sports: val('fSports') || 'None',
                    clubs: val('fClubs') || 'None',
                    positionOfResponsibility: val('fPosition') || 'None',
                    numeracySkills: val('fNumeracy') || 'Average',
                    literacySkills: val('fLiteracy') || 'Average',
                    parentCategory: val('fParentCat') || 'Both Alive',
                    sponsor: val('fSponsor') || '',
                    photo: photo || state.students[idx].photo
                };
                saveState();
                closeModal();
                students();
                toast('Student updated!', 'success');
            };
            if (photoInput && photoInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(e) { updateFn(e.target.result); };
                reader.readAsDataURL(photoInput.files[0]);
                return;
            }
            updateFn(null);
        }

        function deleteStudent(id) {
            if (!confirm('Delete this student?')) return;
            state.students = state.students.filter(s => s.id !== id);
            saveState();
            students();
            toast('Student deleted', 'warning');
        }

        function upgradeClass() {
            if (!confirm('Upgrade all active students to the next class? This will promote all students by one level.')) return;
            const classMap = {};
            state.classes.forEach((c, i) => {
                if (i < state.classes.length - 1) {
                    classMap[c] = state.classes[i + 1];
                } else {
                    classMap[c] = c;
                }
            });
            state.students.forEach(s => {
                if (s.status === 'Active' && classMap[s.class]) {
                    s.class = classMap[s.class];
                }
            });
            saveState();
            students();
            toast('All active students upgraded to the next class!', 'success');
        }

        function getFilteredTeachers() {
            let list = [...state.teachers];
            if (teacherFilter.search) list = list.filter(t =>
                t.name.toLowerCase().includes(teacherFilter.search.toLowerCase()) ||
                t.ecNo.toLowerCase().includes(teacherFilter.search.toLowerCase())
            );
            if (teacherFilter.department) list = list.filter(t => t.department === teacherFilter.department);
            if (teacherFilter.status) list = list.filter(t => t.status === teacherFilter.status);
            list.sort((a, b) => {
                let va = a[teacherSort.col] || '',
                    vb = b[teacherSort.col] || '';
                return teacherSort.dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
            });
            return list;
        }

            let dept = val('tDept');

                    state.departments.push(dept); }
            const photoInput = document.getElementById('tPhoto');
            const saveFn = (photo) => {
                const newT = {
                    id: 't' + Date.now(),
                    ecNo: val('tEcNo'),
                    name: val('tName'),
                    department: dept,
                    subject: val('tSubject'),
                    class: val('tClass'),
                    position: val('tPosition'),
                    qualification: val('tQual'),
                    phone: val('tPhone'),
                    email: val('tEmail'),
                    joined: val('tJoined'),
                    status: val('tStatus'),
                    photo: photo,
                    attendanceLog: []
                };
                state.teachers.push(newT);
                saveState();
                closeModal();
                teachers();
                toast('Teacher added!', 'success');
            };

                const reader = new FileReader();
                reader.onload = function(e) { saveFn(e.target.result); };
                reader.readAsDataURL(photoInput.files[0]);
                return;
            }
            saveFn(null);

        function addSubjectPaperRow() {
            const wrap = $('scPapers');

            div.id = 'scPaperRow_' + i;
            div.innerHTML = `<div class="form-group"><label>Paper ${i + 1} Name</label><input id="scPaperName_${i}" value="Paper ${i + 1}"></div>

            const wrap = $('scPapers');
            if (!wrap) return;
            const rows = wrap.querySelectorAll('[id^="scPaperRow_"]');
            if (rows.length <= 1) { toast('Each subject needs at least 1 paper', 'error'); return; }
            rows[rows.length - 1].remove();
        }

        function saveSubjectConfig(subject) {
            const wrap = $('scPapers');
            const n = wrap ? wrap.querySelectorAll('[id^="scPaperRow_"]').length : 0;
            const papers = [];
            for (let i = 0; i < n; i++) {
                const name = (val(`scPaperName_${i}`) || `Paper ${i + 1}`).trim();
                const maxRaw = parseFloat(val(`scPaperMax_${i}`)) || 100;
                const weight = parseFloat(val(`scPaperWeight_${i}`)) || 0;
                if (maxRaw <= 0) { toast('Raw score must be above 0', 'error'); return; }
                papers.push({ name, maxRaw, weight });
            }
            if (!papers.length) { toast('Add at least one paper', 'error'); return; }
            const examMax = parseFloat(val('scExamMax')) || papers.reduce((s, p) => s + p.weight, 0);
            if (!state.subjectConfigs) state.subjectConfigs = {};
            state.subjectConfigs[subject] = { papers, caMax: parseFloat(val('scCaMax')) || 0, examMax };
            saveState();
            closeModal();
            classesPage();
            toast(`"${subject}" papers configured!`, 'success');
        }

        function loadAttendance() {
            const date = val('attDate');
            const cls = val('attClass');
            if (!date || !cls) { $('attGrid').innerHTML =
                    '<p style="color:var(--text-light);text-align:center;padding:20px;">Select a date and class.</p>';
                return; }
            const studentsInClass = state.students.filter(s => s.class === cls && s.status === 'Active');
            const existRec = state.attendance.find(a => a.date === date && a.class === cls);
            const records = existRec ? existRec.records : {};
            studentsInClass.forEach(s => { if (!records[s.id]) records[s.id] = 'P'; });

            const present = Object.values(records).filter(v => v === 'P').length;
            const absent = Object.values(records).filter(v => v === 'A').length;
            const late = Object.values(records).filter(v => v === 'L').length;
            const sick = Object.values(records).filter(v => v === 'S').length;

            let boysPresent = 0,
                girlsPresent = 0;
            Object.keys(records).forEach(id => {
                if (records[id] === 'P') {

        // ============================================================
        //  MARKS & GRADES (with updated grading)

        const MARKS_PAGE_KEY = 'marks';

        function getGrade(mark) {
            if (mark >= 75) return 'A';
            if (mark >= 60) return 'B';
            if (mark >= 50) return 'C';
            if (mark >= 45) return 'D';
            if (mark >= 40) return 'E';
            return 'U';
        }

        function getGradeClass(mark) { return 'grade-' + getGrade(mark); }

        function getRemark(mark) {
            const g = getGrade(mark);
            const remarks = {
                'A': 'Excellent performance! Keep up the great work.',
                'B': 'Good performance. Continue striving for excellence.',
                'C': 'Satisfactory performance. More effort needed.',
                'D': 'Fair performance. Improvement required.',
                'E': 'Below average. Significant improvement needed.',
                'U': 'Unsatisfactory. Extra help and hard work required.'
            };
            return remarks[g] || '';
        }

        // ---------- Subject paper configs: raw marks + weighting -> final exam mark ----------
        function getSubjectConfig(subject) {
            if (!state.subjectConfigs) state.subjectConfigs = {};
            let cfg = state.subjectConfigs[subject];
            if (!cfg) {
                cfg = { papers: [{ name: 'Paper 1', maxRaw: 100, weight: 60 }], caMax: 40, examMax: 60 };
                state.subjectConfigs[subject] = cfg;
            }
            if (!cfg.papers || !cfg.papers.length) cfg.papers = [{ name: 'Paper 1', maxRaw: 100, weight: 60 }];
            if (cfg.caMax === undefined || cfg.caMax === null) cfg.caMax = 40;
            if (cfg.examMax === undefined || cfg.examMax === null) cfg.examMax = cfg.papers.reduce((s, p) => s + (Number(p.weight) || 0), 0) || 60;
            return cfg;
        }

        function calcExamFromPapers(subject, raws) {
            const cfg = getSubjectConfig(subject);
            let exam = 0;
            cfg.papers.forEach((p, i) => {
                const raw = Math.max(0, Number(raws[i]) || 0);
                const max = Number(p.maxRaw) || 100;
                const w = Number(p.weight) || 0;
                if (max > 0) exam += (raw / max) * w;
            });
            return Math.round(exam * 10) / 10;
        }

        function streamOf(cls) {
            const m = String(cls || '').match(/^(Form\s*\d+|Grade\s*\d+)/i);
            return m ? m[1].replace(/\s+/g, ' ') : (cls || 'Other');
        }

        // Per-student subject totals for a class+term: { studentId: { subjects: {name:{ca,exam,total,grade,remark,papers}}, avg, grade } }
        function getStudentTotals(cls, term) {
            const year = state.settings.academicYear;
            const studentsInClass = state.students.filter(s => s.class === cls && s.status === 'Active');
            const out = {};
            studentsInClass.forEach(s => {
                const sMarks = state.marks.filter(m => m.studentId === s.id && m.term === term && m.year === year);
                const subjects = {};
                sMarks.forEach(m => {
                    if (!subjects[m.subject]) subjects[m.subject] = { ca: 0, exam: 0, papers: null };
                    if (m.type === 'CA') subjects[m.subject].ca = Number(m.mark) || 0;
                    else { subjects[m.subject].exam = Number(m.mark) || 0; subjects[m.subject].papers = m.papers || null; }
                });
                Object.keys(subjects).forEach(subj => {
                    const t = subjects[subj].ca + subjects[subj].exam;
                    subjects[subj].total = Math.round(t * 10) / 10;
                    subjects[subj].grade = getGrade(t);
                    subjects[subj].remark = getRemark(t);
                });
                const vals = Object.values(subjects).map(x => x.total);
                const avg = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length * 10) / 10 : 0;
                out[s.id] = { student: s, subjects, avg, grade: getGrade(avg), count: vals.length };
            });
            return out;
        }

        function getClassSubjectAverages(cls, term) {
            const totals = getStudentTotals(cls, term);
            const agg = {};
            Object.values(totals).forEach(t => {
                Object.keys(t.subjects).forEach(subj => {
                    if (!agg[subj]) agg[subj] = { sum: 0, n: 0 };
                    agg[subj].sum += t.subjects[subj].total;
                    agg[subj].n++;
                });
            });
            const res = {};
            Object.keys(agg).forEach(subj => { res[subj] = agg[subj].n ? Math.round(agg[subj].sum / agg[subj].n * 10) / 10 : 0; });
            return res;
        }

        function rankList(rows, desc) {
            return [...rows].sort((a, b) => desc ? b.total - a.total : a.total - b.total);
        }

        function autoRemarkFor(avg, count) {
            if (!count) return 'No marks recorded this term.';
            if (avg >= 75) return 'Outstanding overall performance across all subjects. Keep it up!';
            if (avg >= 60) return 'Good overall performance. Aim even higher next term.';
            if (avg >= 50) return 'Satisfactory, but there is room for improvement in some subjects.';
            if (avg >= 40) return 'Below expectations. The learner must work harder in weak subjects.';
            return 'Poor overall performance. Urgent intervention and extra support required.';
        }

            const cfg = getSubjectConfig(subj);

            const totalEl = document.getElementById('total_' + studentId);
            const examEl = document.getElementById('exam_' + studentId);
            const gradeEl = document.getElementById('grade_' + studentId);
            const remarkEl = document.getElementById('remark_' + studentId);
            if (!caEl || !totalEl) return;
            const ca = Math.max(0, parseFloat(caEl.value) || 0);
            const raws = cfg.papers.map((p, i) => {
                const el = document.getElementById(`paper_${studentId}_${i}`);
                return el ? (parseFloat(el.value) || 0) : 0;
            });
            const exam = calcExamFromPapers(subj, raws);
            const total = Math.round((ca + exam) * 10) / 10;
            if (examEl) examEl.textContent = exam;
            totalEl.textContent = total;
            if (gradeEl) { gradeEl.textContent = getGrade(total); gradeEl.className = getGrade(total); }

        function saveMarks() {
            const cls = val('mClass');

            if (!cls || !subj) { toast('Select class and subject first', 'error'); return; }

            studentsInClass.forEach(s => {
                const caEl = document.getElementById('ca_' + s.id);
                if (!caEl) return;

                const ca = Math.max(0, parseFloat(caEl.value) || 0);
                const papers = {};
                const raws = cfg.papers.map((p, i) => {
                    const el = document.getElementById(`paper_${s.id}_${i}`);
                    const v = el ? (parseFloat(el.value) || 0) : 0;
                    papers[p.name] = v;
                    return v;
                });
                const exam = calcExamFromPapers(subj, raws);

                const caExisting = state.marks.findIndex(m => m.studentId === s.id && m.subject === subj && m.type === 'CA' && m.term === term && m.year === year);
                const caEntry = {
                    id: 'm' + Date.now() + s.id + 'ca',
                    studentId: s.id,
                    studentName: s.name,
                    class: cls,
                    subject: subj,
                    term,
                    type: 'CA',
                    year,
                    mark: ca,
                    outOf: cfg.caMax,
                    remark: getRemark(ca),
                    grade: getGrade(ca),
                    enteredBy: currentUser.name,
                    enteredAt: new Date().toISOString()
                };
                if (caExisting >= 0) state.marks[caExisting] = caEntry;
                else state.marks.push(caEntry);

                const examExisting = state.marks.findIndex(m => m.studentId === s.id && m.subject === subj && m.type === 'Exam' && m.term === term && m.year === year);
                const examEntry = {
                    id: 'm' + Date.now() + s.id + 'ex',
                    studentId: s.id,
                    studentName: s.name,
                    class: cls,
                    subject: subj,
                    term,
                    type: 'Exam',
                    year,
                    mark: exam,
                    outOf: cfg.examMax,
                    papers,
                    remark: getRemark(exam),
                    grade: getGrade(exam),
                    enteredBy: currentUser.name,
                    enteredAt: new Date().toISOString()
                };
                if (examExisting >= 0) state.marks[examExisting] = examEntry;
                else state.marks.push(examEntry);
            });
            saveState();
            toast('Marks saved successfully!', 'success');
            renderAllMarks();
        }

        function renderAnalysis(keepSubject) {
            const cls = val('anClass');
            const term = val('anTerm');
            const box = $('analysisContainer');
            if (!box) return;
            if (!cls) { box.innerHTML = '<p style="color:var(--text-light);padding:20px;text-align:center;">Select a class to run analysis.</p>'; return; }
            const totals = getStudentTotals(cls, term);
            const rows = Object.values(totals);
            const avgs = getClassSubjectAverages(cls, term);
            const subjSel = $('anSubject');
            const prevSubj = keepSubject && subjSel ? subjSel.value : (subjSel ? subjSel.value : '');
            const allSubjs = [...new Set([...Object.keys(avgs), ...state.subjects])];
            if (subjSel) subjSel.innerHTML = allSubjs.map(s => `<option value="${s}" ${s === prevSubj ? 'selected' : ''}>${s}</option>`).join('');
            const focusSubj = (subjSel && subjSel.value) || allSubjs[0] || '';

            const withSubj = rows.filter(r => r.subjects[focusSubj]);
            const topSubj = rankList(withSubj.map(r => ({ name: r.student.name, admNo: r.student.admNo, total: r.subjects[focusSubj].total, grade: r.subjects[focusSubj].grade })), true).slice(0, 10);
            const botSubj = rankList(withSubj.map(r => ({ name: r.student.name, admNo: r.student.admNo, total: r.subjects[focusSubj].total, grade: r.subjects[focusSubj].grade })), false).slice(0, 10);
            const overall = rows.map(r => ({ name: r.student.name, admNo: r.student.admNo, total: r.avg, grade: r.grade, count: r.count }));
            const topAll = rankList(overall, true).slice(0, 10);
            const botAll = rankList(overall, false).slice(0, 10);

            // Stream (e.g. all Form 1s)
            const stream = streamOf(cls);
            const streamClasses = state.classes.filter(c => streamOf(c) === stream);
            let streamRows = [];
            streamClasses.forEach(c => {
                Object.values(getStudentTotals(c, term)).forEach(t => streamRows.push({ name: t.student.name + ` (${c})`, admNo: t.student.admNo, total: t.avg, grade: t.grade, count: t.count, class: c, studentId: t.student.id }));
            });
            const topStream = rankList(streamRows, true).slice(0, 10);
            const botStream = rankList(streamRows, false).slice(0, 10);
            const fivePlus = streamRows.filter(r => r.count >= 5).sort((a, b) => b.total - a.total);

            const tbl = (title, list, extra) => `
                <div class="card" style="margin-bottom:0;">
                    <div class="card-header"><span class="card-title">${title}</span></div>
                    ${list.length ? `<div class="table-wrap"><table><thead><tr><th>#</th><th>Student</th><th>Adm No</th>${extra || ''}<th>Mark</th><th>Grade</th></tr></thead><tbody>
                    ${list.map((r, i) => `<tr><td>${i + 1}</td><td>${r.name}</td><td>${r.admNo || ''}</td>${extra ? `<td>${r.count} subjects</td>` : ''}<td><strong>${r.total}</strong></td><td class="${r.grade}">${r.grade}</td></tr>`).join('')}
                    </tbody></table></div>` : '<p style="color:var(--text-light);font-size:13px;">No data.</p>'}
                </div>`;

            box.innerHTML = `
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;">
                    <div class="card" style="margin-bottom:0;">
                        <div class="card-header"><span class="card-title">📌 Class Average per Subject — ${cls}</span></div>
                        ${Object.keys(avgs).length ? `<div class="table-wrap"><table><thead><tr><th>Subject</th><th>Average</th><th>Grade</th></tr></thead><tbody>
                        ${Object.keys(avgs).map(s => `<tr><td>${s}</td><td><strong>${avgs[s]}</strong></td><td class="${getGrade(avgs[s])}">${getGrade(avgs[s])}</td></tr>`).join('')}
                        </tbody></table></div>` : '<p style="color:var(--text-light);font-size:13px;">No marks for this term.</p>'}
                    </div>
                    ${tbl(`🏆 Best 10 in ${focusSubj} (${cls})`, topSubj)}
                    ${tbl(`🔻 Bottom 10 in ${focusSubj} (${cls})`, botSubj)}
                    ${tbl(`🏆 Best 10 Overall (${cls})`, topAll, true)}
                    ${tbl(`🔻 Bottom 10 Overall (${cls})`, botAll, true)}
                    ${tbl(`🌊 Best 10 Overall — Stream: ${stream}`, topStream, true)}
                    ${tbl(`🌊 Bottom 10 Overall — Stream: ${stream}`, botStream, true)}
                    <div class="card" style="margin-bottom:0;">
                        <div class="card-header"><span class="card-title">🎓 Learners with 5+ Subjects — ${stream} (${fivePlus.length})</span></div>
                        ${fivePlus.length ? `<div class="table-wrap"><table><thead><tr><th>#</th><th>Student</th><th>Class</th><th>Subjects</th><th>Avg</th><th>Grade</th></tr></thead><tbody>
                        ${fivePlus.map((r, i) => `<tr><td>${i + 1}</td><td>${r.name}</td><td>${r.class}</td><td>${r.count}</td><td><strong>${r.total}</strong></td><td class="${r.grade}">${r.grade}</td></tr>`).join('')}
                        </tbody></table></div>` : '<p style="color:var(--text-light);font-size:13px;">No learners with 5+ subjects in this stream yet.</p>'}
                    </div>
                </div>`;

            setTimeout(() => {
                try { if (chartInstances.anAvg) chartInstances.anAvg.destroy(); } catch (e) {}
                try { if (chartInstances.anTop) chartInstances.anTop.destroy(); } catch (e) {}
                if ($('anAvgChart') && Object.keys(avgs).length) {
                    chartInstances.anAvg = new Chart($('anAvgChart'), { type: 'bar',
                        data: { labels: Object.keys(avgs), datasets: [{ label: 'Average', data: Object.values(avgs), backgroundColor: '#3949ab' }] },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });
                }
                if ($('anTopChart') && topAll.length) {
                    chartInstances.anTop = new Chart($('anTopChart'), { type: 'bar',
                        data: { labels: topAll.map(r => r.name.split(' ')[0]), datasets: [{ label: 'Average', data: topAll.map(r => r.total), backgroundColor: '#2e7d32' }] },
                        options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } } } });
                }
            }, 120);
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function cloudSuggestedPassword(seed) {
            const base = (seed || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 20) || 'School';
            const word = base.length >= 6 ? base : (base + 'School').slice(0, 20);
            const year = String(new Date().getFullYear());
            return word.charAt(0).toUpperCase() + word.slice(1) + '#' + year + '!';
        }

        function cloudFillPassword(inputId, meterId) {
            const el = $(inputId);
            if (!el) return;
            el.value = cloudSuggestedPassword(val('csName') || val('csStaffName'));
            updatePwdMeter(inputId, meterId);
        }

        function printSingleReport(studentId, term) {
            const s = state.students.find(x => x.id === studentId);
            const pg = state.settings;
            const sMarks = state.marks.filter(m => m.studentId === studentId && m.term === term);
            const sAtt = state.attendance.filter(a => a.records);
            const presentDays = sAtt.filter(a => a.records[studentId] === 'P').length;
            const totalDays = sAtt.length;
            const attPct = totalDays ? Math.round(presentDays / totalDays * 100) : 0;
            
            const subjectTotals = {};
            sMarks.forEach(m => {
                if (!subjectTotals[m.subject]) subjectTotals[m.subject] = { ca: 0, exam: 0 };
                if (m.type === 'CA') subjectTotals[m.subject].ca = Number(m.mark) || 0;
                else subjectTotals[m.subject].exam = Number(m.mark) || 0;
            });
            const classAvgs = getClassSubjectAverages(s.class, term);
            const subjectAverages = Object.keys(subjectTotals).map(subj => {
                const total = Math.round((subjectTotals[subj].ca + subjectTotals[subj].exam) * 10) / 10;
                return { subject: subj, ca: subjectTotals[subj].ca, exam: subjectTotals[subj].exam, classAvg: classAvgs[subj] !== undefined ? classAvgs[subj] : '-', total, grade: getGrade(total), remark: getRemark(total) };
            });
            const avgMark = subjectAverages.length ? Math.round(subjectAverages.reduce((sum, x) => sum + x.total, 0) / subjectAverages.length * 10) / 10 : 0;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18);
            doc.setFont('helvetica', 'bold');
            doc.text(pg.schoolName, 105, 18, { align: 'center' });
            doc.setFontSize(11);
            doc.setFont('helvetica', 'normal');
            doc.text(pg.address, 105, 26, { align: 'center' });
            doc.setFontSize(14);
            doc.setFont('helvetica', 'bold');
            doc.text('STUDENT PROGRESS REPORT', 105, 38, { align: 'center' });
            doc.setFontSize(11);
            doc.setFont('helvetica', 'normal');
            doc.text(`Academic Year: ${pg.academicYear} | ${term}`, 105, 46, { align: 'center' });
            doc.line(14, 50, 196, 50);
            let y = 58;
            doc.setFont('helvetica', 'bold');
            doc.text('STUDENT INFORMATION', 14, y);
            y += 8;
            doc.setFont('helvetica', 'normal');
            doc.text(`Name: ${s.name}`, 14, y);
            doc.text(`Adm No: ${s.admNo}`, 110, y);
            y += 7;
            doc.text(`Class: ${s.class}`, 14, y);
            doc.text(`Gender: ${s.gender}`, 110, y);
            y += 10;
            doc.line(14, y, 196, y);
            y += 8;
            doc.setFont('helvetica', 'bold');
            doc.text('ACADEMIC PERFORMANCE', 14, y);
            y += 8;
            doc.autoTable({
                startY: y,
                head: [
                    ['Subject', 'CA Mark', 'Exam', 'Mark', 'Class Avg', 'Grade', 'Teacher Remark']
                ],
                body: subjectAverages.map(sa => [sa.subject, sa.ca, sa.exam, sa.total, sa.classAvg, sa.grade, useSubj ? sa.remark : '-']),
                styles: { fontSize: 9 },
                headStyles: { fillColor: [26, 35, 126] }
            });
            y = doc.lastAutoTable.finalY + 12;
            doc.setFont('helvetica', 'bold');
            doc.text(`Average Score: ${avgMark}%`, 14, y);
            doc.text(`Overall Grade: ${getGrade(avgMark)}`, 100, y);
            y += 8;
            doc.text(`Attendance: ${presentDays}/${totalDays} days (${attPct}%)`, 14, y);

            const remarkKey = `${s.class}_${term}_${pg.academicYear}`;
            const rk = state.overallRemarks ? state.overallRemarks[remarkKey] : null;
            const live = ($('rpClass') && val('rpClass') === s.class && $('rpTeacherRemark'));
            const pick = (id, saved) => live ? (val(id) || null) : saved;
            const useAuto = live ? $('rpAuto').checked : (!rk || rk.useAutoRemarks !== false);
            const useSports = live ? $('rpSports').checked : (!rk || rk.useSportsRemarks !== false);

            const spR = pick('rpSportsRemark', rk && rk.sportsRemark) || (useSports ? sportsRemarkFor(s) : 'N/A');
            y += 12;

            doc.text('OVERALL REMARKS', 14, y);
            y += 8;
            doc.setFont('helvetica', 'normal');
            doc.text(`Class Teacher: ${tR}`, 14, y);
            y += 7;
            doc.text(`Head: ${hR}`, 14, y);
            y += 7;
            doc.text(`Sports Director: ${spR}`, 14, y);
            y += 12;
            doc.setFont('helvetica', 'bold');
            doc.text(`Next Term (${pg.nextTerm || ''}) Fees: ${fmt(pg.nextTermFees || 0)}`, 14, y);

            y += 12;
            doc.text('Class Teacher: ________________________', 14, y);
            doc.text("Head's Signature: ____________________", 110, y);
            y += 12;
            doc.setFont('helvetica', 'italic');
            doc.text(`Head: ${pg.headName}`, 110, y);
            doc.save(`Report_${s.name.replace(/ /g,'_')}_${term}.pdf`);
            toast('Report downloaded!', 'success');
        }
