        // Billed (expected) vs paid helpers — billed is snapshotted per record at billing time
        function feeBilledOf(f, fcId, fallback) {
            if (f.billed && f.billed[fcId] !== undefined && f.billed[fcId] !== null) return Number(f.billed[fcId]) || 0;
            return fallback;
        }
        function feeBilledTotal(f) {
            if (f.billed && Object.keys(f.billed).length) return Object.values(f.billed).reduce((s, v) => s + (Number(v) || 0), 0);
            return state.feeComponents.reduce((s, fc) => s + fc.amount, 0);
        }
        function feePaidTotal(f) {
            if (!f.payments) return 0;
            return Object.values(f.payments).reduce((s, v) => s + (Number(v) || 0), 0);
        }
        function feeStatusFor(paid, billed) {
            return paid >= billed ? 'Paid' : paid > 0 ? 'Partial' : 'Unpaid';
        }

        function renderFeeTable() {
            let fees = [...state.fees];
            const search = val('fFilt')?.toLowerCase();
            const cls = val('fFiltClass');
            const status = val('fFiltStatus');
            if (search) fees = fees.filter(f => f.studentName.toLowerCase().includes(search));
            if (cls) fees = fees.filter(f => f.class === cls);
            if (status) fees = fees.filter(f => f.status === status);

            const wrap = $('feeTableWrap');
            if (!wrap) return;
            wrap.innerHTML = `<table>
                <thead><tr>
                    <th>Student</th><th>Class</th>
                    ${state.feeComponents.map(fc => `<th>${fc.name}</th>`).join('')}
                    <th>Total Paid</th><th>Balance</th><th>Status</th><th>Actions</th>
                </tr></thead>
                <tbody>
                ${fees.map(f => {
                    const totalExpected = feeBilledTotal(f);
                    const totalPaid = feePaidTotal(f);
                    const balance = totalExpected - totalPaid;
                    return `<tr>
                        <td><strong>${f.studentName}</strong></td>
                        <td>${f.class}</td>
                        ${state.feeComponents.map(fc => {
                            const b = feeBilledOf(f, fc.id, fc.amount);
                            const p = Number(f.payments?.[fc.id]) || 0;
                            return `<td><strong>${fmt(p)}</strong><br><span style="font-size:11px;color:var(--text-light);">of ${fmt(b)}</span></td>`;
                        }).join('')}
                        <td><strong>${fmt(totalPaid)}</strong></td>
                        <td style="color:${balance>0?'var(--danger)':'var(--success)'}">${fmt(balance)}</td>
                        <td><span class="badge-status ${f.status==='Paid'?'badge-success':f.status==='Partial'?'badge-warning':'badge-danger'}">${f.status}</span></td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="editFeeRecord('${f.id}')">✏️</button>
                            <button class="btn btn-sm btn-outline" onclick="printFeeReceipt('${f.id}')">🧾</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteFeeRecord('${f.id}')">🗑️</button>
                        </td>
                    </tr>`;
                }).join('')}
                </tbody>
            </table>`;
        }

        function saveFeeRecord() {
            const studentId = val('feeStudent');
            if (!studentId) { toast('Select a student', 'error'); return; }
            const s = state.students.find(x => x.id === studentId);
            const payments = {};
            const billed = {};
            state.feeComponents.forEach(fc => { payments[fc.id] = parseFloat(val('fee_' + fc.id)) || 0; billed[fc.id] = fc.amount; });
            const totalPaid = Object.values(payments).reduce((s, v) => s + v, 0);
            const totalExpected = Object.values(billed).reduce((s, v) => s + v, 0);
            const status = feeStatusFor(totalPaid, totalExpected);
            const existing = state.fees.findIndex(f => f.studentId === studentId && f.term === val('feeTerm') && f
                .year === val('feeYear'));
            const record = {
                id: 'f' + Date.now(),
                studentId,
                studentName: s.name,
                class: val('feeClass'),
                term: val('feeTerm'),
                year: val('feeYear'),
                payments,
                billed,
                date: val('feeDate'),
                method: val('feeMethod'),
                status
            };
            if (existing >= 0) state.fees[existing] = record;
            else state.fees.push(record);
            saveState();
            closeModal();
            feesPage();
            toast('Payment recorded!', 'success');
        }

            const prev = state.fees[idx];
            const billed = (prev.billed && Object.keys(prev.billed).length) ? prev.billed : Object.fromEntries(state.feeComponents.map(fc => [fc.id, fc.amount]));

        function bulkBillFees() {
            const term = state.settings.term;
            const year = state.settings.academicYear;
            const activeStudents = state.students.filter(s => s.status === 'Active');
            let count = 0;
            activeStudents.forEach(s => {
                const existing = state.fees.find(f => f.studentId === s.id && f.term === term && f.year === year);
                if (!existing) {
                    const payments = {};
                    const billed = {};
                    state.feeComponents.forEach(fc => { payments[fc.id] = 0; billed[fc.id] = fc.amount; });
                    state.fees.push({
                        id: 'f' + Date.now() + s.id,
                        studentId: s.id,
                        studentName: s.name,
                        class: s.class,
                        term,
                        year,
                        payments,
                        billed,
                        date: new Date().toISOString().split('T')[0],
                        method: 'Bulk Billing',
                        status: 'Unpaid'
                    });
                    count++;
                }
            });
            saveState();
            feesPage();
            toast(`${count} fee records created for ${term} ${year}`, 'success');
        }

        function renderBankRecon() {

            const bankBalance = state.openingBalance + credits - debits;
            const clearedCredits = state.bankTransactions.filter(t => t.type === 'credit' && t.cleared).reduce((s, t) => s +
                t.amount, 0);
            const clearedDebits = state.bankTransactions.filter(t => t.type === 'debit' && t.cleared).reduce((s, t) => s + t
                .amount, 0);
            const unclearedCredits = state.bankTransactions.filter(t => t.type === 'credit' && !t.cleared).reduce((s, t) => s +
                t.amount, 0);
            const unclearedDebits = state.bankTransactions.filter(t => t.type === 'debit' && !t.cleared).reduce((s, t) => s + t
                .amount, 0);
            const bankStatBalance = state.openingBalance + clearedCredits - clearedDebits;

            return `<div class="card">
                <div class="card-header">
                    <span class="card-title">🏦 Bank Reconciliation Statement — ${state.settings.academicYear}</span>

                        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-top:1px solid #90caf9;margin-top:4px;padding-top:6px;"><span>Add: Uncleared Credits</span><span style="color:var(--success)">+ ${fmt(unclearedCredits)}</span></div>
                        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;"><span>Less: Uncleared Debits</span><span style="color:var(--danger)">- ${fmt(unclearedDebits)}</span></div>
                        <div style="display:flex;justify-content:space-between;padding:6px 0;font-weight:700;font-size:15px;border-top:2px solid var(--primary);margin-top:4px;"><span>Adjusted Cash Book Balance</span><span style="color:var(--primary)">${fmt(bankBalance + unclearedCredits - unclearedDebits)}</span></div>

                        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-top:1px solid #ce93d8;margin-top:4px;padding-top:6px;"><span>Add: Uncleared Credits</span><span style="color:var(--success)">+ ${fmt(unclearedCredits)}</span></div>
                        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;"><span>Less: Uncleared Debits</span><span style="color:var(--danger)">- ${fmt(unclearedDebits)}</span></div>

            doc.setFontSize(12);
            doc.setFont('helvetica', 'normal');
            doc.text('INCOME AND EXPENDITURE ACCOUNT', 105, 30, { align: 'center' });
            doc.text('For the Year: ' + pg.academicYear, 105, 38, { align: 'center' });

            let y = 50;
            const incomeByCat = {};
            state.income.forEach(i => { const cat = state.incomeCategories.find(c => c.id === i.categoryId); if (cat)
                    incomeByCat[cat.name] = (incomeByCat[cat.name] || 0) + i.amount; });
            const expByCat = {};
            state.expenditure.forEach(e => { const cat = state.expenditureCategories.find(c => c.id === e.categoryId); if (
                    cat) expByCat[cat.name] = (expByCat[cat.name] || 0) + e.amount; });
            const totalIncome = state.income.reduce((s, i) => s + i.amount, 0);
            const totalExp = state.expenditure.reduce((s, e) => s + e.amount, 0);

            doc.autoTable({
                startY: y,

        function uploadDocuments(input) {
            const files = Array.from(input.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const ext = file.name.split('.').pop().toUpperCase();
                    const type = ['PDF'].includes(ext) ? 'PDF' : ['DOC', 'DOCX'].includes(ext) ? 'DOC' : [
                        'XLS', 'XLSX'
                    ].includes(ext) ? 'XLS' : 'Image';
                    const doc = { id: 'd' + Date.now() + Math.random(), name: file.name, type,
                        size: formatFileSize(file.size), date: new Date().toISOString().split('T')[0],
                        dataUrl: e.target.result, uploadedBy: currentUser.name };
                    state.documents.push(doc);
                    saveState();
                    renderDocList('');
                    toast(`"${file.name}" uploaded!`, 'success');
                };
                reader.readAsDataURL(file);
            });
        }

        function filterDocs(type) { renderDocList(type); }

        function renderDocList(type) {
            const list = type ? state.documents.filter(d => d.type === type) : state.documents;
            const wrap = $('docList');
            if (!wrap) return;
            if (!list.length) { wrap.innerHTML =
                    '<div class="empty-state"><div class="icon">📁</div><h3>No documents uploaded</h3><p>Click the upload area to add documents</p></div>'; return; }
            wrap.innerHTML = list.map(doc => {
                const icons = { PDF: '📄', DOC: '📝', XLS: '📊', Image: '🖼️' };
                return `<div class="doc-item">
                    <div class="doc-icon">${icons[doc.type]||'📎'}</div>
                    <div class="doc-info">
                        <div class="doc-name" title="${doc.name}">${doc.name}</div>
                        <div class="doc-size">${doc.size} • ${doc.date}</div>
                        <div class="doc-size" style="color:var(--text-light)">By: ${doc.uploadedBy}</div>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:4px;">
                        <button class="btn btn-sm btn-outline" onclick="downloadDoc('${doc.id}')">⬇️</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteDoc('${doc.id}')">🗑️</button>
                    </div>
                </div>`;
            }).join('');
        }

        function downloadDoc(id) {
            const doc = state.documents.find(d => d.id === id);
            if (!doc) return;
            const a = document.createElement('a');
            a.href = doc.dataUrl;
            a.download = doc.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function deleteDoc(id) { if (!confirm('Delete document?')) return; state.documents = state.documents.filter(d => d
                .id !== id);
            saveState();
            documentsPage(); }

        function formatFileSize(bytes) { if (bytes < 1024) return bytes + ' B'; if (bytes < 1048576) return (bytes / 1024)
                .toFixed(1) + ' KB'; return (bytes / 1048576).toFixed(1) + ' MB'; }

        function generateLearnerProfiles() {
            state.learnerProfiles = state.students.map(s => {
                const marks = state.marks.filter(m => m.studentId === s.id);
                const attendance = state.attendance.filter(a => a.records && a.records[s.id]);
                const present = attendance.filter(a => a.records[s.id] === 'P').length;
                const total = attendance.length;
                const attPct = total ? Math.round(present / total * 100) : 0;
                
                const subjectTotals = {};
                marks.forEach(m => {
                    if (!subjectTotals[m.subject]) subjectTotals[m.subject] = { total: 0, count: 0 };
                    subjectTotals[m.subject].total += m.mark;
                    subjectTotals[m.subject].count++;
                });
                const subjectAverages = Object.keys(subjectTotals).map(subj => ({
                    subject: subj,
                    avg: Math.round(subjectTotals[subj].total / subjectTotals[subj].count)
                }));
                const overallAvg = subjectAverages.length ? Math.round(subjectAverages.reduce((sum, s) => sum + s.avg, 0) / subjectAverages.length) : 0;
                
                const feeRecs = state.fees.filter(f => f.studentId === s.id);
                const totalPaid = feeRecs.reduce((sum, f) => sum + Object.values(f.payments).reduce((a, b) => a + b, 0), 0);
                const totalExpected = feeRecs.reduce((sum, f) => sum + state.feeComponents.reduce((a, fc) => a + fc.amount, 0), 0);
                const feeBalance = totalExpected - totalPaid;
                
                return {
                    studentId: s.id,
                    admNo: s.admNo,
                    name: s.name,
                    class: s.class,
                    gender: s.gender,
                    dob: s.dob,
                    nationalId: s.nationalId,
                    parent: s.parent,
                    phone: s.phone,
                    parentWhatsapp: s.parentWhatsapp || '',
                    email: s.email,
                    address: s.address,
                    chronicIllnesses: s.chronicIllnesses,
                    sports: s.sports,
                    clubs: s.clubs,
                    positionOfResponsibility: s.positionOfResponsibility,
                    numeracySkills: s.numeracySkills,
                    literacySkills: s.literacySkills,
                    parentCategory: s.parentCategory,
                    sponsor: s.sponsor,
                    attendance: attPct + '%',
                    overallGrade: getGrade(overallAvg),
                    overallAverage: overallAvg,
                    subjectAverages: subjectAverages,
                    feeBalance: feeBalance,
                    generatedAt: new Date().toISOString()
                };
            });
            saveState();
            renderLearnerProfiles();
            toast('Learner profiles generated!', 'success');
        }

        function printLearnerProfile(studentId) {
            const p = state.learnerProfiles?.find(x => x.studentId === studentId);
            if (!p) { toast('Profile not found', 'error'); return; }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const pg = state.settings;
            
            doc.setFontSize(18);
            doc.setFont('helvetica', 'bold');
            doc.text(pg.schoolName, 105, 20, { align: 'center' });
            doc.setFontSize(11);
            doc.setFont('helvetica', 'normal');
            doc.text(pg.address, 105, 28, { align: 'center' });
            doc.setFontSize(14);
            doc.setFont('helvetica', 'bold');
            doc.text('LEARNER PROFILE', 105, 40, { align: 'center' });
            doc.line(14, 45, 196, 45);
            
            let y = 55;
            doc.setFontSize(11);
            doc.setFont('helvetica', 'bold');
            doc.text('PERSONAL INFORMATION', 14, y);
            y += 8;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            const fields = [
                ['Name:', p.name],
                ['Admission No:', p.admNo],
                ['Class:', p.class],
                ['Gender:', p.gender],
                ['Date of Birth:', p.dob],
                ['National ID:', p.nationalId],
                ['Parent/Guardian:', p.parent],
                ['Phone:', p.phone],
                ['WhatsApp:', p.parentWhatsapp || 'N/A'],
                ['Email:', p.email],
                ['Address:', p.address],
                ['Chronic Illnesses:', p.chronicIllnesses],
                ['Sports:', p.sports],
                ['Clubs:', p.clubs],
                ['Position of Responsibility:', p.positionOfResponsibility],
                ['Numeracy Skills:', p.numeracySkills],
                ['Literacy Skills:', p.literacySkills],
                ['Parent Category:', p.parentCategory],
                ['Sponsor:', p.sponsor || 'N/A'],
            ];
            fields.forEach(([label, value]) => {
                doc.text(label, 14, y);
                doc.text(value || 'N/A', 80, y);
                y += 7;
                if (y > 270) { doc.addPage(); y = 20; }
            });
            
            y += 6;
            doc.setFont('helvetica', 'bold');
            doc.text('ACADEMIC PERFORMANCE', 14, y);
            y += 8;
            doc.setFont('helvetica', 'normal');
            if (p.subjectAverages && p.subjectAverages.length) {
                doc.autoTable({
                    startY: y,
                    head: [['Subject', 'Average', 'Grade']],

            subjects.forEach(subj => {
                const teacherSelect = document.querySelector(`.ttTeacherSelect[data-subject="${subj}"]`);

                        const entry = { class: cls, subject: subj, teacherId, lessons };

        function generateTimetable() {
            if (!state.timetableInput || state.timetableInput.length === 0) {
                toast('No timetable input data found. Please enter lesson allocations first.', 'error');
                return;
            }
            
            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
            const periods = state.timetablePeriods || ['8:00-9:00', '9:00-10:00', '10:00-11:00', '11:00-12:00', '12:00-13:00', '13:00-14:00', '14:00-15:00'];
            
            const classes = {};
            state.timetableInput.forEach(t => {
                if (!classes[t.class]) classes[t.class] = [];
                classes[t.class].push(t);
            });
            
            let generated = 0;
            Object.keys(classes).forEach(cls => {
                const entries = classes[cls];
                state.timetables = state.timetables.filter(t => t.class !== cls);
                
                entries.forEach(entry => {
                    const teacher = state.teachers.find(t => t.id === entry.teacherId);
                    const teacherName = teacher ? teacher.name : 'Unknown';
                    let lessonsAllocated = 0;
                    for (let day = 0; day < days.length && lessonsAllocated < entry.lessons; day++) {
                        for (let period = 0; period < periods.length && lessonsAllocated < entry.lessons; period++) {
                            const existing = state.timetables.find(t => 
                                t.class === cls && t.day === days[day] && t.period === periods[period]
                            );
                            if (!existing) {
                                state.timetables.push({
                                    id: 'tt' + Date.now() + Math.random(),
                                    class: cls,
                                    day: days[day],
                                    period: periods[period],
                                    subject: entry.subject,
                                    teacher: teacherName,
                                    teacherId: entry.teacherId
                                });
                                lessonsAllocated++;
                            }
                        }
                    }
                });
                generated++;
            });
            
            saveState();
            renderTimetable();
            document.getElementById('generationStatus').innerHTML = `
                <div style="background:#e8f5e9;padding:12px;border-radius:8px;color:var(--success);">
                    ✅ Timetable generated for ${generated} class(es). Total entries: ${state.timetables.length}
                </div>
            `;
            toast('Timetable generated successfully!', 'success');
        }

// ---------- Shared banking helpers ----------
function getTotalCollected() {
    const feesTotal = (state.fees || []).reduce((s, f) => s + Object.values(f.payments || {}).reduce((a, b) => a + (Number(b) || 0), 0), 0);
    const incomeTotal = (state.income || []).reduce((s, i) => s + (Number(i.amount) || 0), 0);
    return feesTotal + incomeTotal;
}
function getCashCollected() {
    // Cash-like methods that physically need to be banked
    const cashMethods = ['Cash', 'Mobile Money'];
    const feesCash = (state.fees || []).reduce((s, f) => {
        const t = Object.values(f.payments || {}).reduce((a, b) => a + (Number(b) || 0), 0);
        if (!f.method || cashMethods.includes(f.method) || f.method === 'Bulk Billing') return s + t;
        return s;
    }, 0);
    // Income records have no method field in base version -> treat as cash collectable
    const incomeCash = (state.income || []).reduce((s, i) => s + (Number(i.amount) || 0), 0);
    return feesCash + incomeCash;
}
function getTotalBanked() {
    return (state.bankDeposits || []).reduce((s, d) => s + (Number(d.amount) || 0), 0);
}
function getCashToBank() {
    return Math.max(0, getCashCollected() - getTotalBanked());
}
function getCollectionsList() {
    const rows = [];
    (state.fees || []).forEach(f => {
        const total = Object.values(f.payments || {}).reduce((a, b) => a + (Number(b) || 0), 0);
        if (total > 0) rows.push({ date: f.date || '', source: 'Fees', description: f.studentName + ' (' + f.class + ', ' + f.term + ')', method: f.method || 'Cash', amount: total, ref: f.id });
    });
    (state.income || []).forEach(i => {
        rows.push({ date: i.date || '', source: 'Income', description: i.description || '-', method: 'Cash/Other', amount: Number(i.amount) || 0, ref: i.reference || i.id });
    });
    rows.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    return rows;
}

                <option value="">All Status</option>
                <option>Open</option><option>Under Review</option><option>Resolved</option><option>Escalated</option>
            </select>
        </div>
        <div class="table-wrap" id="disciplineTableWrap"></div>
        <div id="disciplinePagination"></div>
    </div>
    <div class="card">
        <div class="card-header"><span class="card-title">📊 Offences by Category</span></div>
        <div class="chart-container" style="height:230px;"><canvas id="discChart"></canvas></div>
    </div>
    <div class="card">
        <div class="card-header"><span class="card-title">🔁 Repeat Offenders (2+ cases)</span></div>
        <div id="repeatOffenders"></div>
    </div>`;
    renderDisciplineTable();
    renderRepeatOffenders();
    setTimeout(() => {
        const el = $('discChart');
        if (!el) return;
        const cats = {};
        (state.discipline || []).forEach(d => { cats[d.category] = (cats[d.category] || 0) + 1; });
        chartInstances.disc = new Chart(el, {
            type: 'bar',
            data: { labels: Object.keys(cats), datasets: [{ label: 'Cases', data: Object.values(cats), backgroundColor: '#c62828' }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    }, 120);
}

function getFilteredDiscipline() {
    let list = [...(state.discipline || [])];
    const s = (val('dSearch') || '').toLowerCase();
    const cls = val('dClass'), cat = val('dCategory'), sev = val('dSeverity'), st = val('dStatus');
    if (s) list = list.filter(d => (d.studentName || '').toLowerCase().includes(s));
    if (cls) list = list.filter(d => d.class === cls);
    if (cat) list = list.filter(d => d.category === cat);
    if (sev) list = list.filter(d => d.severity === sev);
    if (st) list = list.filter(d => d.status === st);
    list.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    return list;
}

function renderDisciplineTable() {
    const wrap = $('disciplineTableWrap');
    if (!wrap) return;
    const list = getFilteredDiscipline();
    const { items, totalPages } = getPaginatedData(list, DISCIPLINE_PAGE_KEY, 10);
    const sevBadge = (s) => s === 'Critical' ? 'badge-danger' : s === 'Serious' ? 'badge-warning' : s === 'Moderate' ? 'badge-info' : 'badge-success';
    const stBadge = (s) => s === 'Resolved' ? 'badge-success' : s === 'Escalated' ? 'badge-danger' : s === 'Under Review' ? 'badge-warning' : 'badge-info';
    wrap.innerHTML = `<table>
        <thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Offence</th><th>Severity</th><th>Action Taken</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
        ${items.length ? items.map(d => `<tr>
            <td>${d.date || '-'}</td>
            <td><strong>${d.studentName || '-'}</strong></td>
            <td>${d.class || '-'}</td>
            <td>${d.category || '-'}</td>
            <td><span class="badge-status ${sevBadge(d.severity)}">${d.severity || '-'}</span></td>
            <td style="font-size:12px;">${d.actionTaken || '-'}</td>
            <td><span class="badge-status ${stBadge(d.status)}">${d.status || '-'}</span></td>
            <td style="white-space:nowrap;">
                <button class="btn btn-sm btn-outline" onclick="viewDiscipline('${d.id}')">👁️</button>
                <button class="btn btn-sm btn-primary" onclick="editDiscipline('${d.id}')">✏️</button>
                <button class="btn btn-sm btn-danger" onclick="deleteDiscipline('${d.id}')">🗑️</button>
            </td>
        </tr>`).join('') : '<tr><td colspan="8"><div class="empty-state"><div class="icon">🚨</div><h3>No discipline cases</h3><p>Record your first case.</p></div></td></tr>'}
        </tbody></table>`;
    renderPagination(DISCIPLINE_PAGE_KEY, totalPages, 'disciplinePagination', 'goToDisciplinePage');
}

function goToDisciplinePage(p) {
    if (p < 1) return;
    const totalPages = Math.ceil(getFilteredDiscipline().length / 10) || 1;
    if (p > totalPages) return;
    paginationState[DISCIPLINE_PAGE_KEY].page = p;
    renderDisciplineTable();
}

function renderRepeatOffenders() {
    const wrap = $('repeatOffenders');
    if (!wrap) return;
    const counts = {};
    (state.discipline || []).forEach(d => {
        const k = d.studentId || d.studentName;
        if (!k) return;
        if (!counts[k]) counts[k] = { name: d.studentName, class: d.class, count: 0, serious: 0 };
        counts[k].count++;
        if (d.severity === 'Serious' || d.severity === 'Critical') counts[k].serious++;
    });
    const reps = Object.values(counts).filter(r => r.count >= 2).sort((a, b) => b.count - a.count);
    if (!reps.length) { wrap.innerHTML = '<p style="color:var(--text-light);font-size:13px;">No repeat offenders. Good discipline! 🎉</p>'; return; }
    wrap.innerHTML = `<table><thead><tr><th>Student</th><th>Class</th><th>Cases</th><th>Serious</th></tr></thead><tbody>
        ${reps.map(r => `<tr><td><strong>${r.name}</strong></td><td>${r.class || '-'}</td><td><span class="badge-status badge-warning">${r.count} cases</span></td><td>${r.serious}</td></tr>`).join('')}
    </tbody></table>`;
}

function disciplineFormHTML(d = {}) {
    return `<div class="form-grid">
        <div class="form-group"><label>Student*</label><select id="dStudent">
            <option value="">Select Student</option>
            ${state.students.map(s => `<option value="${s.id}" data-class="${s.class}" data-name="${s.name}" ${d.studentId === s.id ? 'selected' : ''}>${s.name} (${s.admNo}, ${s.class})</option>`).join('')}
        </select></div>
        <div class="form-group"><label>Date*</label><input type="date" id="dDate" value="${d.date || new Date().toISOString().split('T')[0]}"></div>
        <div class="form-group"><label>Offence Category*</label><select id="dCat">
            ${['Latecoming','Bullying','Fighting','Theft','Vandalism','Disrespect','Cheating','Absconding','Drug/Alcohol','Uniform','Noise/Misconduct','Other'].map(c => `<option value="${c}" ${d.category === c ? 'selected' : ''}>${c}</option>`).join('')}
        </select></div>
        <div class="form-group"><label>Severity*</label><select id="dSev">
            ${['Minor','Moderate','Serious','Critical'].map(c => `<option value="${c}" ${d.severity === c ? 'selected' : ''}>${c}</option>`).join('')}
        </select></div>
        <div class="form-group" style="grid-column:1/-1;"><label>Description*</label><textarea id="dDesc" rows="3" placeholder="What happened? Where? When?">${d.description || ''}</textarea></div>
        <div class="form-group"><label>Action Taken*</label><select id="dAction">
            ${['Warning','Counselling','Detention','Parent Called','Community Work','Suspension','Expulsion','No Action','Other'].map(c => `<option value="${c}" ${d.actionTaken === c ? 'selected' : ''}>${c}</option>`).join('')}
        </select></div>
        <div class="form-group"><label>Status</label><select id="dStat">
            ${['Open','Under Review','Resolved','Escalated'].map(c => `<option value="${c}" ${d.status === c ? 'selected' : ''}>${c}</option>`).join('')}

        <div class="form-group"><label>Reported By</label><input id="dReportedBy" value="${d.reportedBy || (currentUser ? currentUser.name : '')}"></div>

function openAddDiscipline() {
    openModal('Record Discipline Case', disciplineFormHTML(), [
        { label: 'Cancel', cls: 'btn-outline', action: 'closeModal()' },
        { label: 'Save Case', cls: 'btn-primary', action: 'saveDiscipline()' }
    ]);
}

function saveDiscipline() {
    const sel = $('dStudent');
    if (!sel || !sel.value) { toast('Select a student', 'error'); return; }
    const opt = sel.options[sel.selectedIndex];
    const desc = val('dDesc');
    if (!desc) { toast('Enter a description', 'error'); return; }
    if (!state.discipline) state.discipline = [];
    state.discipline.push({
        id: 'd' + Date.now(),
        studentId: sel.value,
        studentName: opt.dataset.name || opt.text,
        class: opt.dataset.class || '',
        date: val('dDate') || new Date().toISOString().split('T')[0],
        category: val('dCat'),
        severity: val('dSev'),
        description: desc,
        actionTaken: val('dAction'),
        status: val('dStat') || 'Open',
        reportedBy: val('dReportedBy'),
        recordedBy: currentUser ? currentUser.name : '-',
        createdAt: new Date().toISOString()
    });
    saveState(); closeModal(); disciplinePage();
    toast('Discipline case recorded!', 'success');
}

function editDiscipline(id) {
    const d = (state.discipline || []).find(x => x.id === id);
    if (!d) return;
    openModal('Edit Discipline Case', disciplineFormHTML(d), [
        { label: 'Cancel', cls: 'btn-outline', action: 'closeModal()' },
        { label: 'Update', cls: 'btn-primary', action: `updateDiscipline('${id}')` }
    ]);
}

function updateDiscipline(id) {
    const idx = (state.discipline || []).findIndex(x => x.id === id);
    if (idx < 0) return;
    const sel = $('dStudent');
    const opt = sel.options[sel.selectedIndex];
    state.discipline[idx] = { ...state.discipline[idx],
        studentId: sel.value, studentName: opt.dataset.name || opt.text, class: opt.dataset.class || '',
        date: val('dDate'), category: val('dCat'), severity: val('dSev'),
        description: val('dDesc'), actionTaken: val('dAction'), status: val('dStat'), reportedBy: val('dReportedBy') };
    saveState(); closeModal(); disciplinePage();
    toast('Case updated!', 'success');
}

function deleteDiscipline(id) {
    if (!confirm('Delete this discipline case?')) return;
    state.discipline = (state.discipline || []).filter(d => d.id !== id);
    saveState(); disciplinePage();
    toast('Case deleted', 'warning');
}

function viewDiscipline(id) {
    const d = (state.discipline || []).find(x => x.id === id);
    if (!d) return;
    openModal('Discipline Case — ' + d.studentName, `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px;">
            <div><strong>Date:</strong> ${d.date}</div>
            <div><strong>Class:</strong> ${d.class}</div>
            <div><strong>Offence:</strong> ${d.category}</div>
            <div><strong>Severity:</strong> ${d.severity}</div>
            <div><strong>Action:</strong> ${d.actionTaken}</div>
            <div><strong>Status:</strong> ${d.status}</div>
            <div><strong>Reported By:</strong> ${d.reportedBy || '-'}</div>
            <div><strong>Recorded By:</strong> ${d.recordedBy || '-'}</div>
        </div>
        <hr style="margin:12px 0;">
        <div><strong>Description:</strong><br>${d.description || '-'}</div>`,
        [{ label: 'Close', cls: 'btn-outline', action: 'closeModal()' },
         { label: '🖨️ Print', cls: 'btn-primary', action: `printDisciplineRecord('${d.id}')` }]);
}

function exportDisciplineCSV() {
    const list = getFilteredDiscipline();
    downloadCSV('Discipline', ['Date', 'Student', 'Class', 'Offence', 'Severity', 'Action', 'Status', 'Reported By', 'Description'],
        list.map(d => [d.date, d.studentName, d.class, d.category, d.severity, d.actionTaken, d.status, d.reportedBy, d.description]));
}

function exportDisciplinePDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('l');
    doc.setFontSize(16);
    doc.text(state.settings.schoolName + ' - Discipline Report', 14, 18);
    doc.setFontSize(10);
    doc.text('Generated: ' + new Date().toISOString().split('T')[0], 14, 26);
    doc.autoTable({
        startY: 32,
        head: [['Date', 'Student', 'Class', 'Offence', 'Severity', 'Action', 'Status']],
        body: getFilteredDiscipline().map(d => [d.date, d.studentName, d.class, d.category, d.severity, d.actionTaken, d.status]),
        styles: { fontSize: 9 }, headStyles: { fillColor: [198, 40, 40] }
    });
    doc.save('Discipline_Report.pdf');
    toast('Discipline PDF exported!', 'success');
}

function printDisciplineRecord(id) {
    const d = (state.discipline || []).find(x => x.id === id);
    if (!d) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(17); doc.setFont('helvetica', 'bold');
    doc.text(state.settings.schoolName, 105, 18, { align: 'center' });
    doc.setFontSize(13); doc.text('DISCIPLINE CASE RECORD', 105, 28, { align: 'center' });
    doc.setFontSize(11); doc.setFont('helvetica', 'normal');
    let y = 42;
    [['Student:', d.studentName], ['Class:', d.class], ['Date:', d.date], ['Offence:', d.category],
     ['Severity:', d.severity], ['Action Taken:', d.actionTaken], ['Status:', d.status],
     ['Reported By:', d.reportedBy || '-']].forEach(([k, v]) => { doc.text(k + ' ' + (v || '-'), 14, y); y += 8; });
    y += 4; doc.setFont('helvetica', 'bold'); doc.text('Description:', 14, y); y += 8;
    doc.setFont('helvetica', 'normal');
    doc.text(doc.splitTextToSize(d.description || '-', 180), 14, y);
    doc.save('Discipline_' + (d.studentName || 'case').replace(/ /g, '_') + '.pdf');
}

function bankingPage() {
    const collected = getTotalCollected();
    const cashCollected = getCashCollected();
    const banked = getTotalBanked();
    const toBank = getCashToBank();
    const pct = cashCollected ? Math.round(banked / cashCollected * 100) : 0;
    const pending = (state.bankDeposits || []).filter(d => d.status === 'Pending').reduce((s, d) => s + (Number(d.amount) || 0), 0);

    $('pageContent').innerHTML = `
    <div class="stats-grid">
        <div class="stat-card" style="border-color:#1a237e;">
            <div class="stat-icon" style="background:#e8eaf6;">💰</div>
            <div class="stat-info"><h3>${fmt(collected)}</h3><p>Total Collected (Fees+Income)</p></div>
        </div>
        <div class="stat-card" style="border-color:#0d47a1;">
            <div class="stat-icon" style="background:#e3f2fd;">💵</div>
            <div class="stat-info"><h3>${fmt(cashCollected)}</h3><p>Cash Collectable</p></div>
        </div>
        <div class="stat-card" style="border-color:#2e7d32;">
            <div class="stat-icon" style="background:#e8f5e9;">🏦</div>
            <div class="stat-info"><h3>${fmt(banked)}</h3><p>Total Banked</p></div>
        </div>
        <div class="stat-card" style="border-color:${toBank > 0 ? '#c62828' : '#2e7d32'};">
            <div class="stat-icon" style="background:${toBank > 0 ? '#ffebee' : '#e8f5e9'};">🧾</div>
            <div class="stat-info"><h3>${fmt(toBank)}</h3><p>To Be Banked (Cash on Hand)</p></div>
        </div>
    </div>
    <div class="card">
        <div class="card-header"><span class="card-title">🏦 Banking Progress</span>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="openAddBankDeposit()">➕ Bank Cash Now</button>
                <button class="btn btn-outline" onclick="printBankingSummary()">🖨️ Summary</button>
            </div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;"><span>Banked ${pct}% of cash</span><span>Pending: ${fmt(pending)}</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, pct)}%;background:${pct >= 90 ? 'var(--success)' : pct >= 50 ? 'var(--primary)' : 'var(--danger)'};"></div></div>
        <p style="font-size:12px;color:var(--text-light);margin-top:8px;">To Be Banked = Cash-collectable (Cash / Mobile Money fees + income) minus confirmed + pending bank deposits. Bank-transfer fees are already in the bank and excluded from cash on hand.</p>
    </div>
    <div class="card">
        <div class="card-header"><span class="card-title">🧾 Collections Awaiting Banking</span>
            <div class="btn-group">
                <button class="btn btn-outline" onclick="exportBankingCSV()">📊 CSV</button>
                <button class="btn btn-outline" onclick="exportBankingPDF()">📄 PDF</button>
            </div>
        </div>
        <div class="filter-bar">
            <input type="text" id="bkSearch" placeholder="🔍 Search collections..." oninput="renderBankingCollections()">
            <select id="bkMethod" onchange="renderBankingCollections()">
                <option value="">All Methods</option>
                <option>Cash</option><option>Mobile Money</option><option>Bank Transfer</option><option>Cheque</option><option>Cash/Other</option>
            </select>
        </div>
        <div class="table-wrap" id="bankingCollectionsWrap"></div>
    </div>
    <div class="card">
        <div class="card-header"><span class="card-title">🏦 Bank Deposits Log</span>
            <button class="btn btn-outline" onclick="exportDepositsCSV()">📊 Deposits CSV</button>
        </div>
        <div class="table-wrap" id="bankDepositsWrap"></div>
    </div>`;
    renderBankingCollections();
    renderBankDeposits();
}

function renderBankingCollections() {
    const wrap = $('bankingCollectionsWrap');
    if (!wrap) return;
    let rows = getCollectionsList();
    const s = (val('bkSearch') || '').toLowerCase();
    const m = val('bkMethod');
    if (s) rows = rows.filter(r => (r.description || '').toLowerCase().includes(s));
    if (m) rows = rows.filter(r => r.method === m);
    const total = rows.reduce((a, r) => a + (Number(r.amount) || 0), 0);
    wrap.innerHTML = `<table><thead><tr><th>Date</th><th>Source</th><th>Description</th><th>Method</th><th>Amount</th></tr></thead>
        <tbody>${rows.slice(0, 100).map(r => `<tr><td>${r.date || '-'}</td><td>${r.source}</td><td>${r.description}</td><td><span class="badge-status badge-info">${r.method}</span></td><td><strong>${fmt(r.amount)}</strong></td></tr>`).join('') || '<tr><td colspan="5">No collections yet.</td></tr>'}</tbody>
        <tfoot><tr style="font-weight:700;background:#f0f4ff;"><td colspan="4">TOTAL (showing up to 100)</td><td>${fmt(total)}</td></tr></tfoot></table>
        ${rows.length > 100 ? `<p style="font-size:12px;color:var(--text-light);">Showing 100 of ${rows.length} rows. Use CSV export for full list.</p>` : ''}`;
}

function renderBankDeposits() {
    const wrap = $('bankDepositsWrap');
    if (!wrap) return;
    const list = [...(state.bankDeposits || [])].sort((a, b) => String(b.date).localeCompare(String(a.date)));
    if (!list.length) { wrap.innerHTML = '<div class="empty-state"><div class="icon">🏦</div><h3>No deposits yet</h3><p>Click “Bank Cash Now” to record your first deposit.</p></div>'; return; }
    wrap.innerHTML = `<table><thead><tr><th>Date</th><th>Bank / Ref</th><th>Amount</th><th>Deposited By</th><th>Status</th><th>Actions</th></tr></thead><tbody>
        ${list.map(d => `<tr><td>${d.date}</td><td>${d.bankName || 'Bank'}<br><span style="font-size:11px;color:var(--text-light);">${d.reference || d.id}</span></td>
        <td><strong style="color:var(--success)">${fmt(d.amount)}</strong></td><td>${d.depositedBy || '-'}</td>
        <td><span class="badge-status ${d.status === 'Confirmed' ? 'badge-success' : 'badge-warning'}">${d.status}</span></td>
        <td style="white-space:nowrap;">
            ${d.status === 'Pending' ? `<button class="btn btn-sm btn-success" onclick="confirmBankDeposit('${d.id}')">✅ Confirm</button>` : ''}
            <button class="btn btn-sm btn-outline" onclick="printDepositSlip('${d.id}')">🧾 Slip</button>
            <button class="btn btn-sm btn-danger" onclick="deleteBankDeposit('${d.id}')">🗑️</button>
        </td></tr>`).join('')}</tbody></table>`;
}

function openAddBankDeposit() {
    const toBank = getCashToBank();
    openModal('Bank Cash — New Deposit', `<div class="form-grid">
        <div class="form-group"><label>Date*</label><input type="date" id="bdDate" value="${new Date().toISOString().split('T')[0]}"></div>
        <div class="form-group"><label>Amount* (max ${fmt(toBank)})</label><input type="number" id="bdAmount" value="${toBank}" min="1" max="${toBank}"></div>
        <div class="form-group"><label>Bank Name</label><input id="bdBank" placeholder="e.g., CBZ, Stanbic"></div>
        <div class="form-group"><label>Deposit Slip / Ref</label><input id="bdRef" placeholder="e.g., DEP-001"></div>
        <div class="form-group"><label>Deposited By</label><input id="bdBy" value="${currentUser ? currentUser.name : ''}"></div>
        <div class="form-group"><label>Status</label><select id="bdStatus"><option>Confirmed</option><option>Pending</option></select></div>
        <div class="form-group" style="grid-column:1/-1;"><label>Notes</label><textarea id="bdNotes" rows="2" placeholder="Cash breakdown, cheques included..."></textarea></div>
    </div>
    <p style="font-size:12px;color:var(--text-light);">Cash on hand available to bank: <strong>${fmt(toBank)}</strong></p>`, [
        { label: 'Cancel', cls: 'btn-outline', action: 'closeModal()' },
        { label: 'Save Deposit', cls: 'btn-success', action: 'saveBankDeposit()' }
    ]);
}

function saveBankDeposit() {
    const amount = parseFloat(val('bdAmount')) || 0;
    if (amount <= 0) { toast('Enter a valid amount', 'error'); return; }
    if (amount > getCashToBank() + 0.01) { toast('Amount exceeds cash on hand to be banked', 'error'); return; }
    if (!state.bankDeposits) state.bankDeposits = [];
    state.bankDeposits.push({ id: 'bd' + Date.now(), date: val('bdDate') || new Date().toISOString().split('T')[0],
        amount, bankName: val('bdBank') || 'Bank', reference: val('bdRef') || ('DEP-' + String(Date.now()).slice(-6)),
        depositedBy: val('bdBy'), status: val('bdStatus') || 'Confirmed', notes: val('bdNotes'),
        createdBy: currentUser ? currentUser.name : '-' });
    saveState(); closeModal(); bankingPage();
    toast('Deposit recorded!', 'success');
}

function confirmBankDeposit(id) {
    const d = (state.bankDeposits || []).find(x => x.id === id);
    if (!d) return;
    d.status = 'Confirmed';
    saveState(); bankingPage();
    toast('Deposit confirmed!', 'success');
}

function deleteBankDeposit(id) {
    if (!confirm('Delete this deposit? Cash on hand will increase.')) return;
    state.bankDeposits = (state.bankDeposits || []).filter(d => d.id !== id);
    saveState(); bankingPage();
}

function printDepositSlip(id) {

    doc.setFontSize(13); doc.text('BANK DEPOSIT SLIP', 105, 28, { align: 'center' });
    doc.setFontSize(11); doc.setFont('helvetica', 'normal');
    let y = 44;
    [['Date:', d.date], ['Bank:', d.bankName], ['Reference:', d.reference], ['Amount:', fmt(d.amount)],
     ['Deposited By:', d.depositedBy || '-'], ['Status:', d.status], ['Notes:', d.notes || '-']].forEach(([k, v]) => { doc.text(k + ' ' + v, 14, y); y += 9; });
    y += 8; doc.text('Cashier: ____________________', 14, y); doc.text('Teller: ____________________', 110, y);

function printBankingSummary() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(17); doc.setFont('helvetica', 'bold');

        // ---------- Secure passwords: strength meter + enforcement ----------
        function passwordStrength(pw) {
            if (!pw) return { score: 0, label: 'Enter a password', color: 'var(--text-light)' };
            let score = 0;
            if (pw.length >= 8) score++;
            if (pw.length >= 12) score++;
            if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
            if (/\d/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;
            if (score <= 2) return { score, label: 'Weak', color: 'var(--danger)' };
            if (score === 3) return { score, label: 'Fair', color: 'var(--warning)' };
            if (score === 4) return { score, label: 'Strong', color: '#1565c0' };
            return { score, label: 'Very strong', color: 'var(--success)' };
        }
        function isStrongPassword(pw) {
            return !!pw && pw.length >= 8 && /[a-z]/.test(pw) && /[A-Z]/.test(pw) && /\d/.test(pw) && /[^A-Za-z0-9]/.test(pw);
        }
        function updatePwdMeter(inputId, meterId) {
            const pw = val(inputId);
            const r = passwordStrength(pw);
            const m = $(meterId);
            if (!m) return;
            m.innerHTML = `<div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, r.score * 20)}%;background:${r.color};"></div></div>
                <div style="font-size:12px;margin-top:4px;color:${r.color};font-weight:600;">${r.label}</div>
                <div style="font-size:11px;color:var(--text-light);">Minimum 8 characters with UPPER + lower + number + symbol (e.g. Sunshine#2025)</div>`;
        }

        function addSystemUser() {
            openModal('Add System User', `<div class="form-grid">
                <div class="form-group"><label>Full Name*</label><input id="uName"></div>
                <div class="form-group"><label>Username*</label><input id="uUsername"></div>
                <div class="form-group"><label>Password* (min 8: UPPER + lower + number + symbol)</label><input type="password" id="uPassword" oninput="updatePwdMeter('uPassword','uPwdMeter')"><div id="uPwdMeter" style="margin-top:6px;"></div></div>
                <div class="form-group"><label>Role*</label><select id="uRole">
                    <option value="admin">Administrator</option>
                    <option value="head">Head</option>
                    <option value="teacher">Teacher</option>
                    <option value="accountant">Accountant</option>
                    <option value="parent">Parent</option>
                </select></div>
                <div class="form-group"><label>Email</label><input type="email" id="uEmail"></div>
            </div>`, [
                { label: 'Cancel', cls: 'btn-outline', action: 'closeModal()' },
                { label: 'Add User', cls: 'btn-primary', action: 'saveSystemUser()' }
            ]);
        }

        function saveSystemUser() {
            const username = val('uUsername'),
                password = val('uPassword'),
                name = val('uName');
            if (!username || !password || !name) { toast('Fill all required fields', 'error'); return; }
            if (state.users.find(u => u.username === username)) { toast('Username already exists', 'error'); return; }
            if (!isStrongPassword(password)) { toast('Password too weak: min 8 chars with UPPER + lower + number + symbol', 'error'); return; }
            state.users.push({ id: 'u' + Date.now(), username, password: hashPassword(password), name, role: val(
                    'uRole'), email: val('uEmail') });
            if (val('uRole') === 'head') {
                state.settings.headName = name;
                syncHeadName();
            }
            saveState();
            closeModal();
            settingsPage();
            toast('User added!', 'success');
        }

        function editSystemUser(id) {
            const u = state.users.find(x => x.id === id);
            openModal('Edit User', `<div class="form-grid">
                <div class="form-group"><label>Full Name</label><input id="uName" value="${u.name}"></div>
                <div class="form-group"><label>Username</label><input id="uUsername" value="${u.username}"></div>
                <div class="form-group"><label>New Password (min 8: UPPER + lower + number + symbol)</label><input type="password" id="uPassword" placeholder="Leave blank to keep current" oninput="updatePwdMeter('uPassword','uPwdMeter')"><div id="uPwdMeter" style="margin-top:6px;"></div></div>
                <div class="form-group"><label>Role</label><select id="uRole">
                    ${['admin','head','teacher','accountant','parent'].map(r => `<option value="${r}" ${u.role===r?'selected':''}>${cap(r)}</option>`).join('')}
                </select></div>
                <div class="form-group"><label>Email</label><input type="email" id="uEmail" value="${u.email}"></div>
            </div>`, [
                { label: 'Cancel', cls: 'btn-outline', action: 'closeModal()' },
                { label: 'Update', cls: 'btn-primary', action: `updateSystemUser('${id}')` }
            ]);
        }

        function updateSystemUser(id) {
            const idx = state.users.findIndex(x => x.id === id);
            const newPwd = val('uPassword');
            if (newPwd && !isStrongPassword(newPwd)) { toast('New password too weak: min 8 chars with UPPER + lower + number + symbol', 'error'); return; }
            const oldRole = state.users[idx].role;
            const newRole = val('uRole');
            state.users[idx] = { ...state.users[idx], name: val('uName'), username: val('uUsername'), role: newRole, 
                email: val('uEmail'), ...(newPwd ? { password: hashPassword(newPwd) } : {}) };
            
            if (newRole === 'head') {
                state.settings.headName = state.users[idx].name;
                syncHeadName();
            } else if (oldRole === 'head' && newRole !== 'head') {
                // If head role removed, find another head or set default
                const newHead = state.users.find(u => u.role === 'head');
                state.settings.headName = newHead ? newHead.name : 'Head (Not Assigned)';
                syncHeadName();
            }
            
            if (currentUser && currentUser.id === id) {
                currentUser.name = state.users[idx].name;
                currentUser.role = state.users[idx].role;
                $('sidebarUser').textContent = currentUser.name + ' (' + cap(currentUser.role) + ')';
                $('userAvatar').textContent = currentUser.name[0];
            }
            saveState();
            closeModal();
            settingsPage();
            toast('User updated!', 'success');
        }

        function deleteSystemUser(id) {
            if (id === currentUser.id) { toast("Can't delete your own account", 'error'); return; }
            if (!confirm('Delete user?')) return;
            const wasHead = state.users.find(u => u.id === id)?.role === 'head';
            state.users = state.users.filter(u => u.id !== id);
            if (wasHead) {
                const newHead = state.users.find(u => u.role === 'head');
                state.settings.headName = newHead ? newHead.name : 'Head (Not Assigned)';
                syncHeadName();
            }
            saveState();
            settingsPage();
        }

            openModal('Change My Password', `<div class="form-grid">
                <div class="form-group"><label>Current Password*</label><input type="password" id="cpCurrent"></div>
                <div class="form-group"><label>New Password* (min 8: UPPER + lower + number + symbol)</label><input type="password" id="cpNew" oninput="updatePwdMeter('cpNew','cpMeter')"><div id="cpMeter" style="margin-top:6px;"></div></div>

        function saveMyPassword() {
            const cur = val('cpCurrent');
            const nw = val('cpNew');
            const cf = val('cpConfirm');
            if (!cur || !nw || !cf) { toast('Fill all fields', 'error'); return; }
            if (nw !== cf) { toast('New passwords do not match', 'error'); return; }
            if (nw === cur) { toast('New password must differ from the current one', 'error'); return; }
            if (!isStrongPassword(nw)) { toast('Password too weak: min 8 chars with UPPER + lower + number + symbol', 'error'); return; }
            if (window.SMS_SUPABASE.configured) {
                window.SMS_SUPABASE.changeMyPassword(nw).then(r => {
                    if (!r.ok) { toast(r.error, 'error'); return; }
                    toast('Password changed successfully!', 'success');
                    closeModal();
                });
                return;
            }
            if (!verifyPassword(cur, currentUser.password)) { toast('Current password is incorrect', 'error'); return; }
            const idx = state.users.findIndex(u => u.id === currentUser.id);
            state.users[idx].password = hashPassword(nw);
            currentUser.password = state.users[idx].password;
            saveState();
            closeModal();
            toast('Password changed successfully!', 'success');
        }

        // ---- Backup functions (fixed) ----
        function exportBackup() {
            const data = JSON.stringify(state, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `SMS_Backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            toast('Backup exported successfully!', 'success');
        }

        function importBackup(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.settings && data.students && data.teachers) {
                        if (confirm('This will replace all current data. Are you sure?')) {
                            state = data;
                            saveState();
                            toast('Database imported successfully! Refreshing...', 'success');
                            setTimeout(() => location.reload(), 1500);
                        }
                    } else {
                        toast('Invalid backup file format', 'error');
                    }
                } catch (err) {
                    toast('Error reading backup file: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
            input.value = '';
        }

        function resetDatabase() {
            if (!confirm('⚠️ This will delete ALL data and reset to default. Are you sure?')) return;
            if (!confirm('⚠️ FINAL WARNING: This action cannot be undone!')) return;
            state = getDefaultState();
            saveState();
            toast('Database reset to default! Refreshing...', 'warning');
            setTimeout(() => location.reload(), 1500);
        }

        // ============================================================
        //  SWIPE GESTURES FOR SIDEBAR
        // ============================================================
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            const deltaX = e.changedTouches[0].screenX - touchStartX;
            const deltaY = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(deltaX) > 20 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
                if (deltaX > 0 && window.innerWidth <= 768) {
                    $('sidebar').classList.add('open');
                } else if (deltaX < -20 && window.innerWidth <= 768) {
                    $('sidebar').classList.remove('open');
                }
            }
        }, { passive: true });

        // ============================================================
        (async function init() {
            await loadState();
            syncHeadName();
            $('loginSchoolName').textContent = state.settings.schoolName;
            if (state.settings.logo) {
                $('loginLogo').innerHTML = `<img src="${state.settings.logo}" alt="Logo">`;

        })();

        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#topbar')) $('notifPanel').style.display = 'none';
        });

        const setVH = () => {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', vh + 'px');
        };
        setVH();
        window.addEventListener('resize', setVH);
